  <!-- 微信内置浏览器引导：微信不给网页麦克风/相机权限，语音陪伴、拍照识别须在系统浏览器使用。
       独立脚本，不依赖 React，检测到微信才注入可关闭的顶部横幅。 -->
  <script>
    (function () {
      if (!/MicroMessenger/i.test(navigator.userAgent || "")) return;
      var done = false;
      function mount() {
        if (done || !document.body) return;
        done = true;
        var bar = document.createElement("div");
        bar.style.cssText = [
          "position:fixed", "top:0", "left:0", "right:0", "z-index:99999",
          "background:#FFECE6", "border-bottom:2px solid #F79B83",
          "padding:10px 14px", "box-shadow:0 2px 8px rgba(0,0,0,.08)",
          "font-family:'Fredoka','Noto Sans SC',sans-serif",
          "display:flex", "align-items:center", "gap:10px"
        ].join(";");
        var ico = document.createElement("span");
        ico.textContent = "🎙️"; ico.style.fontSize = "22px";
        var txt = document.createElement("span");
        txt.style.cssText = "flex:1;font-size:13.5px;line-height:1.45;color:#7a4a35";
        txt.innerHTML = "<b>语音 / 拍照请在浏览器打开</b><br>点右上角 <b>···</b> → 「在浏览器中打开」（iPhone 选「在 Safari 中打开」）";
        var close = document.createElement("span");
        close.textContent = "×";
        close.style.cssText = "font-size:22px;color:#b07a5a;padding:0 4px;cursor:pointer;line-height:1";
        close.addEventListener("click", function () { bar.remove(); });
        bar.appendChild(ico); bar.appendChild(txt); bar.appendChild(close);
        document.body.insertBefore(bar, document.body.firstChild);
      }
      if (document.body) mount();
      else document.addEventListener("DOMContentLoaded", mount);
    })();
  </script>

    /* 高对比模式（Task #6，默认关闭）：只在 body.yb-hc 时叠加，

<body class="min-h-screen text-slate-800 antialiased flex flex-col justify-between">

  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useRef, useMemo } from "react";
    import { createRoot } from "react-dom/client";
    import { createClient } from "@supabase/supabase-js";
    import { 
      Calendar, Clock, Heart, Shield, Plus, HeartHandshake, User, Settings,
      Activity, Users, ClipboardCheck, ArrowRight, Pill, Smile, PlusCircle,
      Bell, MessageSquare, Sparkles, ChevronRight, CheckCircle2, RotateCcw, Home,
      Trash2, Share2, Stethoscope, ChevronDown, Menu, X, Trophy, PawPrint
    } from "lucide-react";

    // ======================================================================
    // 黏土宠物 3D 建模工具箱
    // 材质与灯光严格沿用原版（PRD §11.3），六种动物仅以「几何形态 + 局部配色」
    // 区分物种，保证是同一套美术体系。
    // ======================================================================

    // 每种动物的配色：body 主体黏土 / accent 品牌蜜桃色（耳内·鼻子·脚掌，
    // 全员共用以保持家族感）/ alt 物种辅色（吻部·肚皮·尾尖）
    // fit：整体缩放，保证挤压拉伸到 1.15 倍时仍不出画（兔子耳朵最长，缩得多一点）
    const PET_SPECS = {
      bunny:   { emoji: '🐰', body: 0xfffcf7, accent: 0xf79b83, alt: 0xfff1ea, fit: 0.88 },
      bear:    { emoji: '🐻', body: 0xfaeacd, accent: 0xf79b83, alt: 0xffdcb0, fit: 0.92 },
      cat:     { emoji: '🐱', body: 0xffe4cc, accent: 0xf79b83, alt: 0xfffcf7, fit: 0.92 },
      dog:     { emoji: '🐶', body: 0xfffcf7, accent: 0xf79b83, alt: 0xcfe6f5, fit: 0.94 },
      penguin: { emoji: '🐧', body: 0xaebbd6, accent: 0xf79b83, alt: 0xfffcf7, fit: 0.92 },
      fox:     { emoji: '🦊', body: 0xffc9a5, accent: 0xf79b83, alt: 0xfffcf7, fit: 0.92 },
    };

    // 原版黏土材质参数，不得改动
    const makeClayMat = (color) => new THREE.MeshStandardMaterial({
      color, roughness: 0.95, metalness: 0.05, flatShading: false,
    });

    // 相机机位：透视相机的 fov 是竖直方向的，容器越窄横向可视范围越小。
    // 吃药动画会瞬间压扁到 0.55，横向被放大到 1.45 倍，此时狐狸尾巴/猫尾会顶出画面。
    // 所以容器竖长（aspect<1）时把相机往后拉，保证横向永远不窄于正方形时的取景。
    const CAM_Z = 7.5;
    const cameraZ = (aspect) => CAM_Z / Math.min(1, aspect || 1);

    // 底部加胖的球——原版兔子头的手法，是黏土「坐感」的来源
    function plumpSphere(r, fatten = 1.15, seg = 40) {
      const g = new THREE.SphereGeometry(r, seg, seg);
      const p = g.attributes.position;
      for (let i = 0; i < p.count; i++) {
        if (p.getY(i) < 0) { p.setX(i, p.getX(i) * fatten); p.setZ(i, p.getZ(i) * fatten); }
      }
      g.computeVertexNormals();
      return g;
    }

    // 椭球——四肢、躯干、肚皮的通用积木
    function blob(mat, sx, sy, sz, x = 0, y = 0, z = 0) {
      const m = new THREE.Mesh(new THREE.SphereGeometry(1, 28, 28), mat);
      m.scale.set(sx, sy, sz);
      m.position.set(x, y, z);
      return m;
    }

    // 记录初始姿态，供动画在其基础上叠加偏移
    function pivot(x, y, z, rz = 0, rx = 0) {
      const g = new THREE.Group();
      g.position.set(x, y, z);
      g.rotation.z = rz;
      g.rotation.x = rx;
      g.userData.base = { rx, rz };
      g.userData.cur = rx;   // 动画中的平滑基线，与叠加的正弦抖动分开存
      return g;
    }

    // 亮黑眼珠 + 蜜桃腮红，六种动物统一
    function addFace(head, mats, eyeR, ex, ey, ez, cheekR, cx, cy, cz) {
      const eyeGeo = new THREE.SphereGeometry(eyeR, 24, 24);
      const eyeL = new THREE.Mesh(eyeGeo, mats.eye); eyeL.position.set(-ex, ey, ez);
      const eyeR2 = new THREE.Mesh(eyeGeo, mats.eye); eyeR2.position.set(ex, ey, ez);
      head.add(eyeL, eyeR2);
      if (cheekR > 0) {
        const cGeo = new THREE.SphereGeometry(cheekR, 20, 14);
        const cL = new THREE.Mesh(cGeo, mats.cheek); cL.position.set(-cx, cy, cz);
        const cR = new THREE.Mesh(cGeo, mats.cheek); cR.position.set(cx, cy, cz);
        head.add(cL, cR);
      }
      return [eyeL, eyeR2];
    }

    // ---------------------------------------------------------------- 兔兔·糖包
    function buildBunny(mats) {
      const g = new THREE.Group();
      const head = new THREE.Group(); head.position.y = 0.62; g.add(head);
      head.add(new THREE.Mesh(plumpSphere(1.15), mats.body));

      const ears = [-1, 1].map((s) => {
        // 长耳是兔子的识别特征，但拉伸帧会顶出画面，所以比原版略收短
        const p = pivot(s * 0.46, 0.66, -0.08, s * -0.15, -0.1);
        const ear = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.34, 1.35, 24), mats.body);
        ear.position.y = 0.66;
        const inner = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.18, 1.1, 20), mats.accent);
        inner.position.set(0, 0.66, 0.14);
        p.add(ear, inner); head.add(p); return p;
      });

      const nose = new THREE.Mesh(new THREE.SphereGeometry(0.09, 16, 16), mats.accent);
      nose.position.set(0, -0.2, 1.1); head.add(nose);
      const eyes = addFace(head, mats, 0.115, 0.4, 0.02, 1.04, 0.2, 0.6, -0.3, 0.95);

      g.add(blob(mats.body, 1.0, 0.92, 0.85, 0, -0.85, 0));
      const arms = [-1, 1].map((s) => {
        const p = pivot(s * 0.9, -0.62, 0.18, s * 0.22);
        p.add(blob(mats.body, 0.24, 0.4, 0.24, 0, -0.34, 0));
        g.add(p); return p;
      });
      [-1, 1].forEach((s) => g.add(blob(mats.body, 0.4, 0.26, 0.54, s * 0.52, -1.6, 0.26)));
      g.add(blob(mats.body, 0.3, 0.3, 0.28, 0, -1.0, -0.86));   // 团子尾巴
      return { group: g, head, ears, arms, eyes, tail: null, wings: [] };
    }

    // ---------------------------------------------------------------- 小熊·奶酪熊
    function buildBear(mats) {
      const g = new THREE.Group();
      const head = new THREE.Group(); head.position.y = 0.58; g.add(head);
      head.add(new THREE.Mesh(plumpSphere(1.18, 1.1), mats.body));

      const ears = [-1, 1].map((s) => {
        const p = pivot(s * 0.82, 0.78, -0.12);
        const ear = new THREE.Mesh(new THREE.SphereGeometry(0.32, 22, 22), mats.body);
        const inner = new THREE.Mesh(new THREE.SphereGeometry(0.18, 18, 18), mats.accent);
        inner.position.z = 0.16; inner.scale.z = 0.6;
        p.add(ear, inner); head.add(p); return p;
      });

      head.add(blob(mats.alt, 0.48, 0.34, 0.34, 0, -0.44, 0.92));  // 吻部
      const nose = new THREE.Mesh(new THREE.SphereGeometry(0.15, 18, 18), mats.accent);
      nose.position.set(0, -0.34, 1.22); head.add(nose);
      const eyes = addFace(head, mats, 0.12, 0.4, 0.08, 1.06, 0.19, 0.68, -0.24, 0.9);

      g.add(blob(mats.body, 1.12, 0.98, 0.92, 0, -0.95, 0));
      g.add(blob(mats.alt, 0.62, 0.52, 0.3, 0, -0.92, 0.78));       // 肚皮
      const arms = [-1, 1].map((s) => {
        const p = pivot(s * 1.0, -0.72, 0.14, s * 0.26);
        p.add(blob(mats.body, 0.3, 0.46, 0.3, 0, -0.38, 0));
        g.add(p); return p;
      });
      [-1, 1].forEach((s) => g.add(blob(mats.body, 0.44, 0.34, 0.54, s * 0.58, -1.68, 0.22)));
      g.add(blob(mats.body, 0.22, 0.22, 0.2, 0, -1.24, -0.92));
      return { group: g, head, ears, arms, eyes, tail: null, wings: [] };
    }

    // ---------------------------------------------------------------- 小猫·小甜橘
    function buildCat(mats) {
      const g = new THREE.Group();
      const head = new THREE.Group(); head.position.y = 0.66; g.add(head);
      const skull = new THREE.Mesh(plumpSphere(1.08, 1.12), mats.body);
      skull.scale.x = 1.06; head.add(skull);

      const ears = [-1, 1].map((s) => {                              // 三角立耳
        const p = pivot(s * 0.6, 0.78, -0.04, s * -0.2);
        const ear = new THREE.Mesh(new THREE.ConeGeometry(0.33, 0.6, 4), mats.body);
        ear.position.y = 0.26; ear.rotation.y = Math.PI / 4;
        const inner = new THREE.Mesh(new THREE.ConeGeometry(0.19, 0.38, 4), mats.accent);
        inner.position.set(0, 0.22, 0.1); inner.rotation.y = Math.PI / 4;
        p.add(ear, inner); head.add(p); return p;
      });

      [-1, 1].forEach((s) => head.add(blob(mats.alt, 0.26, 0.2, 0.18, s * 0.19, -0.42, 0.92)));
      const nose = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.12, 3), mats.accent);
      nose.position.set(0, -0.26, 1.06); nose.rotation.x = Math.PI; head.add(nose);
      [-1, 1].forEach((s) => [0.06, -0.06].forEach((dy) => {         // 胡须
        const w = new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.016, 0.8, 6), mats.eye);
        w.position.set(s * 0.62, -0.36 + dy, 0.78); w.rotation.z = Math.PI / 2 + s * 0.12;
        head.add(w);
      }));
      const eyes = addFace(head, mats, 0.13, 0.42, 0.04, 0.98, 0.19, 0.66, -0.28, 0.86);

      g.add(blob(mats.body, 0.86, 0.94, 0.8, 0, -0.9, 0));
      const arms = [-1, 1].map((s) => {
        const p = pivot(s * 0.42, -1.32, 0.42);
        p.add(blob(mats.body, 0.22, 0.28, 0.32, 0, -0.22, 0));
        g.add(p); return p;
      });
      [-1, 1].forEach((s) => g.add(blob(mats.body, 0.34, 0.4, 0.42, s * 0.68, -1.3, -0.04)));

      // 长尾逐节收细，并向侧后方扬起——正面也要看得见，否则少了一个识别特征
      const tail = pivot(0.46, -1.02, -0.52, -0.46, -0.18);
      [0, 1, 2, 3, 4].forEach((i) => {
        const r = 0.2 - i * 0.022;
        const seg = new THREE.Mesh(new THREE.SphereGeometry(r, 18, 18), i === 4 ? mats.alt : mats.body);
        seg.position.set(0, i * 0.34, -i * 0.1);
        tail.add(seg);
      });
      g.add(tail);
      return { group: g, head, ears, arms, eyes, tail, wings: [] };
    }

    // ---------------------------------------------------------------- 小狗·糯米
    function buildDog(mats) {
      const g = new THREE.Group();
      const head = new THREE.Group(); head.position.y = 0.62; g.add(head);
      head.add(new THREE.Mesh(plumpSphere(1.14), mats.body));

      const ears = [-1, 1].map((s) => {                              // 垂耳
        const p = pivot(s * 0.88, 0.34, 0.02, s * 0.3);
        const ear = blob(mats.alt, 0.28, 0.56, 0.16, 0, -0.5, 0);
        p.add(ear); head.add(p); return p;
      });

      head.add(blob(mats.body, 0.4, 0.32, 0.44, 0, -0.36, 0.94));    // 吻部
      const nose = new THREE.Mesh(new THREE.SphereGeometry(0.14, 18, 18), mats.accent);
      nose.position.set(0, -0.3, 1.36); head.add(nose);
      const mouth = new THREE.Mesh(new THREE.TorusGeometry(0.12, 0.028, 8, 20, Math.PI), mats.eye);
      mouth.position.set(0, -0.5, 1.2); mouth.rotation.z = Math.PI; head.add(mouth);
      const eyes = addFace(head, mats, 0.12, 0.4, 0.1, 1.04, 0.2, 0.66, -0.24, 0.9);

      g.add(blob(mats.body, 0.94, 0.9, 0.85, 0, -0.9, 0));
      g.add(blob(mats.alt, 0.5, 0.44, 0.26, 0, -0.82, 0.74));
      const arms = [-1, 1].map((s) => {
        const p = pivot(s * 0.48, -1.3, 0.4);
        p.add(blob(mats.body, 0.24, 0.3, 0.32, 0, -0.24, 0));
        g.add(p); return p;
      });

    // WebGL 可用性检测——老人手机可能不支持，白屏等于稳定性丢分（PRD F1.6）
    function detectWebGL() {
      try {
        // 先判断 Three.js 是否成功加载（CDN 失败时可能 undefined）
        if (typeof THREE === 'undefined') return false;
        const c = document.createElement('canvas');
        return !!(window.WebGLRenderingContext && (c.getContext('webgl') || c.getContext('experimental-webgl')));
      } catch (e) { return false; }
    }

    function ClayPet3D({ petId = 'bunny', petState, bubbleText, onPetClick }) {
      const containerRef = useRef(null);
      const sceneRef = useRef(null);
      const rendererRef = useRef(null);
      const stageRef = useRef(null);      // 外层：承载弹簧挤压
      const modelRef = useRef(null);      // 内层：当前物种的网格与动画句柄
      const dragAngleY = useRef(0);
      const dragAngleX = useRef(0);
      const dragStart = useRef({ x: 0, y: 0, angleY: 0, angleX: 0, dragging: false, moved: false });
      const stateRef = useRef(petState);  // 状态经 ref 传入动画循环，避免重建场景

      useEffect(() => { stateRef.current = petState; }, [petState]);

      const targetScaleY = useRef(1.0);
      const velocityY = useRef(0.0);

      // Trigger squash effect
      const triggerSquash = () => {
        if (dragStart.current.moved) {

      useEffect(() => {
        if (!containerRef.current || !webglOk) return;

        const width = containerRef.current.clientWidth;
        const height = containerRef.current.clientHeight;

        const scene = new THREE.Scene();
        sceneRef.current = scene;

        const camera = new THREE.PerspectiveCamera(40, width / height, 0.1, 100);
        camera.position.set(0, 0, cameraZ(width / height));

        // 2. Beautiful Soft Ambient Lighting (Studio Clay Render looks)
        const ambientLight = new THREE.AmbientLight(0xfff5f0, 0.7);
        scene.add(ambientLight);

        // Warm direction light (rim support)
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 8, 5);
        scene.add(dirLight);

        // Accent colored bounce light from bottom left
        const bounceLight = new THREE.DirectionalLight(0xffdcd3, 0.4);

        scene.add(bounceLight);

        // 3. 舞台组：只建一次，物种网格由下面的 [petId] effect 挂载进来
        const stage = new THREE.Group();

        let animationFrameId;

        const animate = () => {
          animationFrameId = requestAnimationFrame(animate);
          const elapsedTime = clock.getElapsedTime();

          // Physical Spring solver for "Jelly Squish & Stretch"
          const springConstant = 0.22;
          const damping = 0.76;
          const force = targetScaleY.current - scaleY.current;
          velocityY.current += force * springConstant;
          velocityY.current *= damping;
          scaleY.current += velocityY.current;

          // 挤压回弹永远作用在舞台组上，与具体物种无关
          stage.scale.y = scaleY.current;
          stage.scale.x = 2.0 - scaleY.current;
          stage.scale.z = 2.0 - scaleY.current;

          const model = modelRef.current;
          if (model) {
            const st = stateRef.current;

            // 各状态的姿态参数
            // 注意 §6.3：最差状态是 sleeping（睡着了），不是死亡；不做灰度、不蜷缩成一团
            let amplitude = 0.08, speed = 2.0, headTilt = 0, eyeOpen = 1, limbAmp = 0.12, limbSpeed = 2.4;
            if (st === 'sad') {
              amplitude = 0.03; speed = 0.8; headTilt = -0.16; eyeOpen = 0.62; limbAmp = 0.04; limbSpeed = 1.0;
            } else if (st === 'sleeping') {
              amplitude = 0.02; speed = 0.5; headTilt = -0.10; eyeOpen = 0.06; limbAmp = 0.02; limbSpeed = 0.6;
            } else if (st === 'happy') {
              amplitude = 0.16; speed = 4.2; headTilt = 0.06; eyeOpen = 0.30; limbAmp = 0.30; limbSpeed = 5.0;
            } else if (st === 'eating') {
              amplitude = 0.10; speed = 3.2; eyeOpen = 0.45; limbAmp = 0.22; limbSpeed = 4.0;
            }

            stage.position.y = -0.2 + Math.sin(elapsedTime * speed) * amplitude;
            stage.rotation.y = dragAngleY.current + Math.sin(elapsedTime * 0.7) * 0.04;
            stage.rotation.x = dragAngleX.current;
            stage.rotation.z = Math.cos(elapsedTime * 0.5) * 0.03;

            // 低头 / 抬头。基线单独存，避免咀嚼抖动被 lerp 累积进去
            model.headTilt = lerp(model.headTilt, headTilt, 0.08);
            model.head.rotation.x = model.headTilt
              + (st === 'eating' ? Math.sin(elapsedTime * 16) * 0.05 : 0);

            // 表情：开心眯成月牙，睡着几乎闭合
            model.eyes.forEach((e) => { e.scale.y = lerp(e.scale.y, eyeOpen, 0.12); });

            // 耳朵：难过 / 睡着时垂下，其余时候轻颤
            model.ears.forEach((p, i) => {
              const droop = (st === 'sad' || st === 'sleeping') ? 0.55 : 0;
              p.userData.cur = lerp(p.userData.cur, p.userData.base.rx + droop, 0.08);
              p.rotation.x = p.userData.cur + Math.sin(elapsedTime * limbSpeed + i * 1.7) * limbAmp * 0.5;
            });

            // 手臂 / 前爪
            model.arms.forEach((p, i) => {
              p.rotation.x = Math.sin(elapsedTime * limbSpeed + i * Math.PI) * limbAmp * 0.6;
            });

            // 翅膀拍打（企鹅）
            model.wings.forEach((p, i) => {
              p.rotation.z = p.userData.base.rz
                + Math.sin(elapsedTime * limbSpeed + i * Math.PI) * limbAmp * 0.9;
            });

            // 摇尾巴（狗 / 猫 / 狐狸）
            if (model.tail) {

                + Math.sin(elapsedTime * (limbSpeed + 1.6)) * limbAmp * 1.3;
            }
          }

          renderer.render(scene, camera);
        };

        animate();

        // 6. Fluid Responsive handling
        const handleResize = () => {
          if (!containerRef.current || !rendererRef.current) return;
          const w = containerRef.current.clientWidth;
          const h = containerRef.current.clientHeight;
          camera.aspect = w / h;
          camera.position.z = cameraZ(w / h);
          camera.updateProjectionMatrix();
          rendererRef.current.setSize(w, h);
        };
        window.addEventListener('resize', handleResize);

        // Force final resize immediately
        setTimeout(handleResize, 100);

        return () => {
          cancelAnimationFrame(animationFrameId);
          window.removeEventListener('resize', handleResize);
          if (rendererRef.current && rendererRef.current.domElement) {
            rendererRef.current.dispose();
            if (containerRef.current && containerRef.current.contains(rendererRef.current.domElement)) {
              containerRef.current.removeChild(rendererRef.current.domElement);
            }
          }
          rendererRef.current = null;
        };
      }, [webglOk]);

      // 换宠物时只替换舞台里的网格，不动场景 / 相机 / 灯光 / 渲染器
      useEffect(() => {
        const stage = stageRef.current;
        if (!stage) return;

        const spec = PET_SPECS[petId] || PET_SPECS.bunny;
        const build = PET_BUILDERS[petId] || PET_BUILDERS.bunny;

        // 每只宠物独立持有一套材质，便于单独释放；参数沿用原版
        const mats = {
          body: makeClayMat(spec.body),
          alt: makeClayMat(spec.alt),
          accent: new THREE.MeshStandardMaterial({ color: spec.accent, roughness: 0.9, metalness: 0.0 }),
          eye: new THREE.MeshStandardMaterial({ color: 0x111116, roughness: 0.1, metalness: 0.9 }),
          cheek: new THREE.MeshStandardMaterial({
            color: 0xfca18b, roughness: 0.95, transparent: true, opacity: 0.8,
          }),
        };

        const model = build(mats);
        model.mats = mats;
        model.headTilt = 0;
        model.group.scale.setScalar(spec.fit || 0.92);
        stage.add(model.group);
        modelRef.current = model;

        return () => {
          stage.remove(model.group);
          model.group.traverse((o) => { if (o.geometry) o.geometry.dispose(); });
          Object.values(mats).forEach((m) => m.dispose());
          modelRef.current = null;
        };
      }, [petId, webglOk]);

      const startRotate = (clientX, clientY) => {
        dragStart.current = {
          x: clientX,
          y: clientY,
          angleY: dragAngleY.current,
          angleX: dragAngleX.current,
          dragging: true,
          moved: false
        };
      };

      const moveRotate = (clientX, clientY) => {
        if (!dragStart.current.dragging) return;
        const dx = clientX - dragStart.current.x;
        const dy = clientY - dragStart.current.y;
        if (Math.abs(dx) + Math.abs(dy) > 6) dragStart.current.moved = true;
        dragAngleY.current = dragStart.current.angleY + dx * 0.012;
        dragAngleX.current = Math.max(-0.55, Math.min(0.55, dragStart.current.angleX + dy * 0.008));
      };

      const endRotate = () => {
        dragStart.current.dragging = false;
      };

      return (
        <div
          onClick={triggerSquash}
          onPointerDown={(e) => { e.currentTarget.setPointerCapture?.(e.pointerId); startRotate(e.clientX, e.clientY); }}
          onPointerMove={(e) => moveRotate(e.clientX, e.clientY)}
          onPointerUp={endRotate}
          onPointerCancel={endRotate}
          className="relative w-full h-full cursor-grab active:cursor-grabbing touch-none active:scale-[0.98] transition-transform duration-100"
        >
          {/* Custom Ambient Particle Rings behind the Clay Buddy */}
          <div className="absolute inset-x-0 bottom-12 top-12 rounded-full bg-gradient-to-tr from-rose-100/40 via-sky-100/30 to-violet-100/20 blur-3xl pointer-events-none -z-10" />

          {/* Real WebGL interactive Canvas */}
          <div ref={containerRef} className="w-full h-full" />

          {/* WebGL 不可用时的 2D 降级（PRD F1.6）：老人手机可能跑不动 3D，
              但绝不能白屏——核心流程必须照常可用 */}
          {!webglOk && (
            <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
              <div className="clay-surface-soft w-40 h-40 rounded-full flex items-center justify-center clay-float">
                <span className="text-[5rem] leading-none select-none">
                  {(PET_SPECS[petId] || PET_SPECS.bunny).emoji}
                </span>
              </div>
            </div>
          )}

          {petState === 'sleeping' && (

              💤
            </div>

          <div className="absolute top-4 left-1/2 -translate-x-1/2 w-[85%] max-w-[280px]">
            <div className="relative clay-surface-soft px-5 py-3.5 text-center text-sm md:text-base font-semibold text-slate-700 select-none animate-bounce delay-150 shadow-md">
              <div className="flex items-center justify-center gap-2">
                <span className="text-base">🎈</span>
                <span>{bubbleText}</span>
              </div>
              {/* Bubble dynamic tail */}
              <div className="absolute bottom-[-10px] left-1/2 -translate-x-1/2 w-6 h-6 bg-white rotate-45 border-r border-b border-rose-100/20 shadow-[4px_4px_8px_-2px_rgba(180,190,210,0.15)] rounded-ee-md" />
            </div>

            <Sparkles className="w-3.5 h-3.5 text-rose-400" />
            <span>拖动可360°查看，轻点可捏一捏</span>
          </div>
        </div>
      );
    }

        (window.crypto || window.msCrypto).getRandomValues(buf);

      async function hashPin(familyId, pin) {

      // 从服务端权威 events 流重建「今天某药的已服时段 takenSlots」。
      // 服务端 yb_dose_logs 没有时段列，我们把时段编码进 via（如 "self:13:00"/"proxy:20:00"），
      // 它随 events 往返。多剂次的每一剂都是独立的一条服药动作，最近一次动作决定该时段状态。
      // 无「带时段」事件时返回 null，让上层回退到整药布尔 m.taken（向后兼容旧数据/单剂次）。
      function reconstructTakenSlots(medId, times, events) {
        if (!Array.isArray(events) || !Array.isArray(times) || times.length === 0) return null;
        const today = todayKey();
        const localDateOf = (iso) => {
          const d = new Date(iso);
          if (isNaN(d.getTime())) return "";
          const mm = String(d.getMonth() + 1).padStart(2, "0");
          const dd = String(d.getDate()).padStart(2, "0");
          return `${d.getFullYear()}-${mm}-${dd}`;
        };
        const parseSlot = (via) => {
          const s = String(via || "");
          const i = s.indexOf(":");
          return i >= 0 ? s.slice(i + 1) : "";   // 冒号后是时段；旧数据无冒号 → ""
        };
        const rows = events
          .filter(e => e && e.type === "mom_take" && String(e.medId) === String(medId))
          .filter(e => localDateOf(e.at) === today)        // 用本地日期比对，避免 UTC 时区错位
          .map(e => ({ slot: parseSlot(e.via), taken: !!e.taken, at: e.at }))
          .filter(e => e.slot && times.includes(e.slot))   // 只认仍属于该药的时段
          .sort((a, b) => new Date(b.at) - new Date(a.at)); // 新 → 旧
        if (!rows.length) return null;                     // 无带时段事件 → 交给上层回退
        const state = {};                                  // slot → 最近一次动作是否「已服」
        for (const r of rows) { if (!(r.slot in state)) state[r.slot] = r.taken; }
        return times.filter(t => state[t]);
      }

      // ---- 服药提醒引擎（PRD F2.2）--------------------------------------
      // times 是 "HH:MM" 列表。到点仍未服即进入 pending；超过 GRACE 分钟后
      // 措辞升级为"别忘了"。严格遵守 §6.3：只升级【提醒力度】，绝不自动扣健康、
      // 不指责、不制造焦虑——健康值只在明确点击"我吃了 / 取消"时变化。
      const REMIND_GRACE_MIN = 120;
      const parseHM = (s) => {
        const m = /^(\d{1,2}):(\d{2})$/.exec(String(s || "").trim());
        if (!m) return NaN;
        const h = +m[1], mi = +m[2];
        return h < 24 && mi < 60 ? h * 60 + mi : NaN;
      };
      const fmtHM = (mins) =>
        `${String(Math.floor(mins / 60) % 24).padStart(2, "0")}:${String(mins % 60).padStart(2, "0")}`;

      // 返回 { pending:[{med,slot,refMin,lateMin,overdue}], upcoming:[{med,slot,nextMin}] }
      // 按时段拆分：一种药多个服药时间分别独立判定，不会因为吃了上午那剂就漏掉晚上那剂。
      function computeReminders(meds, now) {
        const cur = now.getHours() * 60 + now.getMinutes();
        const pending = [], upcoming = [];
        for (const med of meds || []) {
          // 已完成的时段：优先取 takenSlots，没有时退回旧 taken 布尔（全完成则=所有时段）
          const takenSlots = med.takenSlots || (med.taken ? (med.times || []) : []);
          const takenMins = new Set(takenSlots.map(parseHM).filter(n => !Number.isNaN(n)));
          // 只保留尚未完成的时段
          const slots = (med.times || []).map(t => ({ t, min: parseHM(t) }))
            .filter(({ min }) => !Number.isNaN(min) && !takenMins.has(min))
            .sort((a, b) => a.min - b.min);
          if (!slots.length) continue;   // 所有时段都完成了
          const due = slots.filter(({ min }) => min <= cur);
          if (due.length) {
            // 每个到点未服的时段各自成为一条 pending。
            // 不能只取欠最久的那个：13:00 一直没点、20:00 到来时，若 pending 里只有 13:00，
            // 通知去重 key（日期|药id|时段）早已标记过 → 20:00 这剂永远收不到提醒（漏服安全问题）。
            for (const { t: slot, min: ref } of due) {
              pending.push({ med, slot, refMin: ref, lateMin: cur - ref, overdue: cur - ref >= REMIND_GRACE_MIN });
            }
          } else {
            const { t: slot, min: nextMin } = slots[0];
            upcoming.push({ med, slot, nextMin });
          }
        }
        pending.sort((a, b) => a.refMin - b.refMin);
        upcoming.sort((a, b) => a.nextMin - b.nextMin);
        return { pending, upcoming };
      }
