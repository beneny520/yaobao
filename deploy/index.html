      // F11.3 医嘱语音速记：录一段 → ASR → 填入医嘱内容（人工确认后保存）
      const [medRecState, setMedRecState] = useState("idle"); // idle | recording | thinking
      const medRecRef = useRef(null);
      const medTalkingRef = useRef(false);   // 家人是否仍按住医嘱录音键（松手权威信号）
      const medHandoffRef = useRef(false);   // SR 出错后是否已交棒给 MediaRecorder（供 onend 判别，避免竞态）

      // Simple animation helper for click pet interaction
      const [petReactState, setPetReactState] = useState('idle'); // 'idle' | 'happy' | 'eating' | 'sad'
      const [elderName, setElderName] = useState(""); // 老人称呼，用于 AI 陪伴个性化（来自云端快照）
      const [healthSignals, setHealthSignals] = useState([]); // F11.4 家人端健康关心信号

      // 静息状态由健康值决定；happy / eating 这类瞬时反应优先级更高会覆盖它。
      // §6.3：最差只到 sleeping（睡着了），永远不会死。
      const petVisualState = (petReactState === 'idle' || petReactState === 'sad')
        ? (selectedPet.healthIndex < 20 ? 'sleeping' : selectedPet.healthIndex < 50 ? 'sad' : 'idle')
        : petReactState;

      // Toast feedback alert
      const [toastMsg, setToastMsg] = useState("");

      // Action: Confirm feeding/taking medicine
      // slot 参数：多剂次药（如 ["13:00","20:00"]）传入具体时段字符串；单次药或整体操作传 null
      const handleTakeMedication = (id, slot = null) => {
        const target = medications.find(m => m.id === id);
        if (!target) return;
        const times = target.times || [];

        // 收敛到单一 effSlot：传了就用，没传就智能选择
        // 单剂次/无时段 → 第一个时段或 null
        // 多剂次无 slot → 下一个未吃时段（智能代记），全吃了取最后一个（撤销）
        let effSlot = slot;
        if (!effSlot) {
          const prevTakenSlots = target.takenSlots || (target.taken ? times : []);
          if (times.length <= 1) {
            effSlot = times[0] || null;
          } else {
            const notYet = times.filter(t => !prevTakenSlots.includes(t));
            effSlot = notYet.length > 0 ? notYet[0] : times[times.length - 1];
          }
        }

        // 计算本次操作后的 takenSlots（函数式更新内部用，避免闭包 stale）
        const computeNext = (prev) => {
          const prevTakenSlots = prev.takenSlots || (prev.taken ? times : []);
          const alreadyDone = effSlot ? prevTakenSlots.includes(effSlot) : prev.taken;
          const actingSlotTaken = !alreadyDone;
          let nextTakenSlots;
          if (effSlot) {
            nextTakenSlots = alreadyDone
              ? prevTakenSlots.filter(s => s !== effSlot)
              : [...prevTakenSlots, effSlot];
          } else {
            nextTakenSlots = actingSlotTaken ? times : [];
          }
          const nextTaken = times.length > 0 && nextTakenSlots.length >= times.length;
          return { actingSlotTaken, nextTaken, nextTakenSlots };
        };

        // 先算一次拿到本次动作结果，给副作用、乐观事件和 RPC 用
        const { actingSlotTaken, nextTaken, nextTakenSlots } = computeNext(target);

        // ---- 乐观更新本地 medication 状态 ----
        setMedications(prev => prev.map(med => {
          if (med.id !== id) return med;
          if (actingSlotTaken) {
            // Yay! Medicating maps to feeding pet!
            setPetReactState('eating');
            setBubbleText("哇呜！啊姆！药片变甜啦，真好吃！⭐");

            // ----- streakDays 按天判定（修复旧 bug：原来按片+1）-----
            const today = todayKey();
            let nextStreak = streakDays;
            if (lastTakeDate !== today) {
              const yesterday = (() => {
                const d = new Date();
                d.setDate(d.getDate() - 1);
                const mm = String(d.getMonth()+1).padStart(2,"0");
                const dd = String(d.getDate()).padStart(2,"0");
                return `${d.getFullYear()}-${mm}-${dd}`;
              })();
              nextStreak = (!lastTakeDate || lastTakeDate === yesterday) ? streakDays + 1 : 1;
              setStreakDays(nextStreak);
              setLastTakeDate(today);
            }

            setWeeklyHistory(prev => prev.map(item => item.day === '今天' ? { ...item, done: Math.min(item.done + 1, item.total) } : item));
            if ([7, 14, 30].includes(nextStreak)) {
              setAchievementShare({ days: nextStreak, pet: selectedPet.name });
              showToast(`🏆 连续打卡 ${nextStreak} 天！生成社区分享卡`);
            }

            const newPoints = Math.min(selectedPet.points + 25, 100);
            let nextLvl = selectedPet.level;
            let nextPoints = newPoints;
            if (newPoints >= 100) { nextLvl += 1; nextPoints = 0; }
            setSelectedPet(current => ({
              ...current,
              points: nextPoints,
              level: nextLvl,
              healthIndex: Math.min(current.healthIndex + 10, 100),
              status: '活力满满',
              lastFeedTime: '刚刚 确认服药'
            }));
            setTimeout(() => {
              setPetReactState('happy');
              setBubbleText(`${selectedPet.name}感到元气满满！谢谢你照顾自己！❤️`);
            }, 1200);
            return { ...med, taken: nextTaken, takenSlots: nextTakenSlots };
          } else {
            setSelectedPet(current => ({
              ...current,
              // §6.3 伦理约束：健康值下限 15，永远不会归零、不会「死」（与服务端 yb_log_dose 一致）
              healthIndex: Math.max(current.healthIndex - 10, 15),
              points: Math.max(current.points - 25, 0)
            }));
            setBubbleText("嗯？吐出来了嘛？不要漏服药哦...");
            return { ...med, taken: nextTaken, takenSlots: nextTakenSlots };
          }
        }));

        // ---- 乐观加一条事件（服务端回来后会用权威 events 覆盖）----
        const authorLabel = viewMode === "mom"
          ? "妈妈 自己确认"
          : `${adminNoteAuthor} 帮记录`;
        setEvents(prev => [{
          id: Date.now(), type: "mom_take", medId: id, medName: target.name,
          taken: actingSlotTaken, author: authorLabel, at: new Date().toISOString(),
        }, ...prev].slice(0, 200));

        // ---- 服药是流水账，只追加：两种视角都写服务端（妈妈自己勾 / 家人代记）----
        // 服务端独占计算积分/等级/健康/连续天数，返回权威快照后整体对齐，避免两端各算一次对不上。
        // via 编码时段（如 "self:13:00" / "proxy:20:00"）供服务端 events 流存储，客户端重建 takenSlots
        if (appDataHydratedRef.current && effSlot) {
          const via = (viewMode === "mom" ? "self" : "proxy") + ":" + effSlot;
          if (UUID_RE.test(String(id))) {
            cloudLogDose(familyId, id, actingSlotTaken, authorLabel, via).then(res => {
              if (res?.snapshot) applyServerSnapshot(res.snapshot, "rpc");
              if (res?.levelUp) showToast(`🎉 恭喜${selectedPet.name}又升了一级！活力无限！`);
              channelRef.current?.notify();     // 通知另一端刷新
              setCloudStatus("synced");
            }).catch(err => {
              console.warn("log_dose failed", err);
              showToast("📡 网络不稳，本地已记录");
            });
          } else {
            // 新药还没拿到服务端 UUID：按「药名+时段」入队，UUID 到位后补发（见 flushPendingDoses）。
            // 同一药同一时段只保留最后一次动作（连点 take/undo 以最终态为准）。
            pendingDosesRef.current = [
              ...pendingDosesRef.current.filter(
                d => !(d.name === target.name && d.slot === effSlot)
              ),
              { name: target.name, slot: effSlot, taken: actingSlotTaken, actor: authorLabel, via, day: todayKey() },
            ];
          }
        }
      };

      // UUID 到位后补发暂存的服药日志（#11）。medications 更新后触发，按药名匹配。
      const flushPendingDoses = (meds) => {
        if (!pendingDosesRef.current.length || !appDataHydratedRef.current) return;
        const rest = [];
        const toSend = [];
        const today = todayKey();
        for (const d of pendingDosesRef.current) {
          if (d.day && d.day !== today) continue;   // 跨天未补发：丢弃，别把昨天的记到今天
          const hit = (meds || []).find(m => m.name === d.name && UUID_RE.test(String(m.id)));
          if (hit) toSend.push({ ...d, id: hit.id });
          else rest.push(d);              // 还没换到 uuid，下次再试
        }
        pendingDosesRef.current = rest;
        if (!toSend.length) return;
        // 串行补发：yb_log_dose 会算积分，并发会互相覆盖快照
        (async () => {
          for (const d of toSend) {
            try {
              const res = await cloudLogDose(familyId, d.id, d.taken, d.actor, d.via);
              if (res?.snapshot) applyServerSnapshot(res.snapshot, "rpc");
            } catch (err) { console.warn("flush dose failed", err); }
          }
          channelRef.current?.notify();
          setCloudStatus("synced");
        })();
      };

      // Action: Quick pats / Interact with Clay Companion
      const handlePetClick = () => {
        const reactions = [
          "哎呀，戳到我的软糯肚皮啦！(晃动)",
          "你摸摸我，我也摸摸你的心！❤️",
          "按时吃药，保持开开心心！",
          "咕噜咕噜，兔兔感觉超级治愈~",
          "你今天过得怎么样？别忘了喝杯水！☕"
        ];
        const randomText = reactions[Math.floor(Math.random() * reactions.length)];
        setBubbleText(randomText);
        setPetReactState('happy');
        setTimeout(() => setPetReactState('idle'), 1500);
      };

      // Send a real note to the mom from an admin family member.
      // 只在 admin 模式生效（mom 视角看不到这个入口）。
      const sendAdminNote = (text, author) => {
        const t = (text || "").trim();
        if (!t) {
          showToast("请先写两句要说的话");
          return Promise.resolve(false);
        }
        const who = author || adminNoteAuthor || "家人";
        // 乐观更新（服务端回来后用权威 events 覆盖）
        setEvents(prev => [{
          id: Date.now(), type: "admin_note", author: who, text: t, at: new Date().toISOString(),
        }, ...prev].slice(0, 200));
        setBubbleText(`${who} 给你留言了 💌`);
        showToast("💌 留言已发到妈妈那一头");

        return cloudAddNote(familyId, t, who, pinForWrite()).then(snap => {
          if (snap) applyServerSnapshot(snap, "rpc");
          channelRef.current?.notify();     // 通知妈妈端刷新
          return true;
        }).catch(err => {
          console.warn("admin_note failed", err);
          showToast("📡 留言上云失败：" + (err.message || ""));
          return false;
        });
      };

      // 老入口：左下"倒杯温水"按钮，admin 模式快速发一条预设留言；mom 模式禁用。
      const feedFamilyReminder = () => {
        if (viewMode === "mom") {
          showToast("妈妈视角看不见这个按钮~");
          return;
        }
        sendAdminNote(`${adminNoteAuthor} 给你倒了一杯温水 ☕`, adminNoteAuthor);
      };

      // Add medication dynamic handler
      const addNewMedication = (e) => {
        e.preventDefault();
        if (!newMedName || !newMedDose || newMedTimes.length === 0) return;

        const emojis = ["💊", "🍬", "🍼", "🍵", "🔮"];
        const randomEmoji = emojis[Math.floor(Math.random() * emojis.length)];

        const newDoseObj = {
          id: Date.now(),
          name: newMedName,
          dose: newMedDose,
          times: newMedTimes.filter(Boolean),
          taken: false,
          icon: randomEmoji,
          color: "from-indigo-200 to-pink-200"
        };

        setMedications([...medications, newDoseObj]);
        setWeeklyHistory(prev => prev.map(item => item.day === '今天' ? { ...item, total: item.total + 1 } : item));
        setNewMedName("");
        setNewMedDose("");
        setNewMedTimes(["08:00"]);
        setShowNewMedModal(false);
        setBubbleText("新安排了药丸！小伙伴会替你记牢的！📝");
        showToast("✅ 成功添加新服药提醒计划");
      };

      const deleteMedication = (id) => {
        setMedications(prev => prev.filter(med => med.id !== id));
        setBubbleText("这颗药丸任务已经从小本本里移除啦。");
        showToast("已删除药物提醒");
      };

      // F11.2 药盒拍照识别：拍一张 → AI 提取草稿 → 人工确认后才落库（安全边界）
      const handleVisionScan = async (file) => {
        if (!file) return;
        setVisionBusy(true); setVisionDraft(null);
        showToast("📷 正在识别药盒，请稍候…");
        const b64 = await blobToBase64(file);
        const res = await callAI({ op: "vision", code: AI_CODE, imageBase64: b64 }, 30000);
        setVisionBusy(false);
        if (res && res.ok && Array.isArray(res.meds) && res.meds.length) {
          // F11.6 兜底：vision 返回的所有文本字段都要过滤医疗红线词。
          // notes 是最危险的一个——模型爱在这里写「建议加大剂量/停药」，且会直接渲染到 UI。
          const safeMeds = res.meds.map(m => ({
            ...m,
            name: sanitizeAIText(m.name),
            dose: sanitizeAIText(m.dose),
            notes: sanitizeAIText(m.notes),
          }));
          setVisionDraft(safeMeds);
          showToast(`✅ 识别到 ${safeMeds.length} 种药，请核对后确认`);
        } else {
          showToast("识别结果为空，请手动填写或换张更清晰的照片");
        }
      };

      const applyVisionDraft = (med) => {
        const emojis = ["💊", "🍬", "🍼", "🍵", "🔮"];
        setNewMedName(med.name || "");
        setNewMedDose(med.dose || "");
        setNewMedTimes((med.times && med.times.length) ? med.times : ["08:00"]);
        setVisionDraft(null);
        showToast("已填入草稿，请核对后点「确认派发」");
      };

      // F11.3 医嘱语音速记：按住录 → 松开转文字 → 追加进医嘱内容框（人工再确认保存）
      const appendMedContent = (t) => {
        const s = (t || "").trim();
        if (!s) return;
        setNewLog((prev) => ({ ...prev, content: (prev.content ? prev.content + " " : "") + s }));
      };
      const startMedDictation = () => {
        // 双保险：medRecState 挡住 thinking 阶段，medTalkingRef（同步）挡住 state 未及更新的快速重按
        if (medRecState !== "idle" || medTalkingRef.current) return;
        medTalkingRef.current = true;
        medHandoffRef.current = false;
        const SR = (typeof window !== "undefined") && (window.SpeechRecognition || window.webkitSpeechRecognition);
        if (SR) {
          try {
            const r = new SR();
            r.lang = "zh-CN"; r.continuous = true; r.interimResults = false;
            let txt = "";
            r.onresult = (ev) => { for (let i = ev.resultIndex; i < ev.results.length; i++) txt += ev.results[i][0].transcript; };
            r.onerror = () => {
              // 微信 X5 内核常拒 Web Speech —— 无缝转 MediaRecorder + 服务端 ASR（不再死寂）
              medRecRef.current = null;
              if (medTalkingRef.current) {
                medHandoffRef.current = true;   // 标记已交棒，onend 不得再跑
                showToast("🎙️ 正在用录音方式，继续说完再松开");
                startMedMediaCapture();
              } else {
                setMedRecState("idle");         // 已松手：别卡在 recording
              }
            };
            r.onend = () => {
              medRecRef.current = null;
              if (medHandoffRef.current) return; // 已交棒给 media，这条 onend 空转
              medTalkingRef.current = false;
              appendMedContent(txt);
              setMedRecState("idle");
            };
            medRecRef.current = { type: "speech", obj: r };
            setMedRecState("recording");
            r.start();
            return;
          } catch { /* 转录音方案 */ }
        }
        startMedMediaCapture();
      };

      // ② MediaRecorder 录音 → 服务端 ASR（SR 不可用或被拒时的兜底）
      const startMedMediaCapture = async () => {
        const canMedia = typeof navigator !== "undefined" && navigator.mediaDevices &&
          navigator.mediaDevices.getUserMedia && typeof window.MediaRecorder !== "undefined";
        if (!canMedia) {
          medTalkingRef.current = false; setMedRecState("idle");
          showToast("这个环境不支持语音，请手动输入");
          return;
        }
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          // 授权/交棒期间可能已松手 —— 立刻释放麦克风，杜绝录音红点常亮
          if (!medTalkingRef.current) {
            try { stream.getTracks().forEach((t) => t.stop()); } catch {}
            medRecRef.current = null; setMedRecState("idle");
            showToast("按住录音键，说完再松开哦");
            return;
          }
          const mr = new window.MediaRecorder(stream);
          const chunks = [];
          mr.ondataavailable = (ev) => { if (ev.data && ev.data.size) chunks.push(ev.data); };
          mr.onstop = async () => {
            try { stream.getTracks().forEach((t) => t.stop()); } catch {}
            medTalkingRef.current = false;
            if (!chunks.length) { medRecRef.current = null; setMedRecState("idle"); showToast("没录到声音，请再试一次"); return; }
            setMedRecState("thinking");
            const blob = new Blob(chunks, { type: mr.mimeType || "audio/webm" });
            const b64 = await blobToBase64(blob);
            const fmt = (mr.mimeType || "webm").includes("mp4") ? "mp4" : "webm";
            const res = await callAI({ op: "asr", code: AI_CODE, audioBase64: b64, format: fmt }, 20000);
            // F11.6 兜底：语音转写落入医嘱框并会存库，过滤医疗红线词（家人会人工复核）
            if (res && res.ok && res.text) appendMedContent(sanitizeAIText(res.text));
            else showToast("没识别到内容，请手动补充");
            medRecRef.current = null; setMedRecState("idle");
          };
          medRecRef.current = { type: "media", obj: mr, stream };
          setMedRecState("recording");
          mr.start();
        } catch {
          medTalkingRef.current = false; setMedRecState("idle");
          showToast("要允许麦克风才能语音速记");
        }
      };
      const stopMedDictation = () => {
        // 松手即置位（权威信号）：即便录音器还没建好，await 后复检也能据此释放麦克风
        medTalkingRef.current = false;
        // 只认 ref（同步写入）：medRecState 是异步 state，快速按放时闭包里可能还是 "idle"，
        // 拿它当条件会漏掉 stop() → 麦克风常亮。已停止的对象再 stop 会抛，try 吞掉即可。
        const cur = medRecRef.current;
        if (cur) { try { cur.obj.stop(); } catch {} }
      };

      const updateMedTime = (index, value) => {
        setNewMedTimes(prev => prev.map((time, i) => i === index ? value : time));
      };

      const addMedTimeField = () => {
        setNewMedTimes(prev => [...prev, "12:00"]);
      };

      const removeMedTimeField = (index) => {
        setNewMedTimes(prev => prev.filter((_, i) => i !== index));
      };

      const savePetChoice = (pet, petProfile) => {
        localStorage.setItem(PET_STORAGE_KEY, JSON.stringify({
          id: pet.id,
          savedAt: new Date().toISOString(),
          selectedPet: petProfile
        }));
      };

      const selectPet = (pet) => {
        const nextProfile = makeSelectedPet(pet, selectedPet);
        setPetCollection(prev => prev.map(item => ({ ...item, selected: item.id === pet.id })));
        setSelectedPet(nextProfile);
        savePetChoice(pet, nextProfile);
        setIsChangingPet(false);
        setPetReactState(pet.state === 'float' ? 'happy' : 'sad');
        setBubbleText(pet.state === 'float' ? `${pet.name}跳进药宝庄园啦！下次打开我也只显示它。` : `${pet.name}需要更多按时喂食来恢复元气。`);
      };

      const addMedicalLog = (e) => {
        e.preventDefault();
        if (!newLog.hospital || !newLog.doctor || !newLog.content) return;
        const log = {
          id: Date.now(),
          hospital: newLog.hospital,
          doctor: newLog.doctor,
          visitDate: new Date().toISOString().slice(0, 10),
          followDate: newLog.followDate || "待确认",
          content: newLog.content,
          tags: ["新增", "医嘱"]
        };
        setMedicalLogs([log, ...medicalLogs]);
        setExpandedLogId(log.id);
        setNewLog({ hospital: "", doctor: "", followDate: "", content: "" });
        showToast("📋 医嘱记录已保存");
      };

      // Toast feedback helper
      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => {
          setToastMsg("");
        }, 3000);
      };

      // 写操作要带的 PIN：演示家庭用公开 PIN，普通家庭用本机保存的 admin PIN。
      const pinForWrite = () => (familyId === DEMO_FAMILY_ID ? DEMO_PIN : adminPin);

      // 配置签名：只看「内容」不看 id，这样服务端把本地整数 id 换成 uuid 后，
      // 签名仍相等 → 防抖保存不会反复回写（apply→save→apply 抖动）。
      const configSignature = (o) => JSON.stringify({
        pet: o.selectedPetId,
        elder: o.family?.elderName || "",   // 关注对象称呼也参与签名，否则改称呼会被判「无变化」而不回写
        meds: (o.medications || []).map(m => [m.name, m.dose, (m.times || []).join(","), m.icon, m.color]),
        members: (o.familyMembers || []).map(m => [m.name, m.relation, m.avatar]),
        logs: (o.medicalLogs || []).map(l => [l.hospital, l.doctor, l.content, (l.tags || []).join(",")]),
      });

      // ---- 服务端快照落地（唯一入口）----
      // yb_snapshot 契约（若某字段对不上，改 SQL 让它符合这个形状，别在这里散兼容分支）：
      //   { family:{code,displayName,elderName,fontScale,highContrast,voiceEnabled},
      //     selectedPetId, selectedPet:{level,points,targetPoints,healthIndex,status,lastFeedTime},
      //     streakDays, lastTakeDate,
      //     medications:[{id,name,dose,times,taken,icon,color,mealRel,source}],
      //     weeklyHistory:[{day,done,total}],
      //     familyMembers:[{id,name,relation,avatar,phone}],
      //     medicalLogs:[{id,hospital,doctor,visitDate,followDate,content,tags}],
      //     events:[{id,type:'mom_take'|'admin_note',...,at}] }
      const applyServerSnapshot = (snap, source) => {
        if (!snap || typeof snap !== "object") return false;
        const petId = snap.selectedPetId || savedPetData.pet.id;
        const petMeta = defaultPets.find(item => item.id === petId) || savedPetData.pet;
        const sp = snap.selectedPet || {};
        const profile = makeSelectedPet(petMeta, {
          level: sp.level, points: sp.points, targetPoints: sp.targetPoints,
          healthIndex: sp.healthIndex ?? sp.health,   // 服务端列名是 pet_health，容忍两种键名
          status: sp.status, lastFeedTime: sp.lastFeedTime,
        });
        setPetCollection(defaultPets.map(item => ({ ...item, selected: item.id === petId })));
        setSelectedPet(profile);
        if (source !== "local") savePetChoice(petMeta, profile);

        if (typeof snap.streakDays === "number") setStreakDays(snap.streakDays);
        if (snap.family && typeof snap.family.elderName === "string") setElderName(snap.family.elderName);
        if (typeof snap.lastTakeDate === "string") setLastTakeDate(snap.lastTakeDate);
        if (Array.isArray(snap.medications)) {
          const evs = Array.isArray(snap.events) ? snap.events : [];
          setMedications(snap.medications.map(m => {
            const times = m.times || [];
            // 优先用服务端 events 流重建今日 takenSlots（跨端权威）；
            // events 里没有该药记录时回退到 m.takenSlots / m.taken（兼容单剂次与历史日志）
            const fromEvents = reconstructTakenSlots(m.id, times, evs);
            const takenSlots = fromEvents != null
              ? fromEvents
              : (m.takenSlots || (m.taken ? times : []));
            // taken 由 takenSlots 反推：所有时段都勾了才算整药完成
            const taken = times.length > 0
              ? takenSlots.length >= times.length
              : !!m.taken;
            return { ...m, takenSlots, taken };
          }));
        }
        if (Array.isArray(snap.weeklyHistory)) setWeeklyHistory(snap.weeklyHistory);
        if (Array.isArray(snap.familyMembers)) setFamilyMembers(snap.familyMembers);
        if (Array.isArray(snap.events)) setEvents(snap.events);
        if (Array.isArray(snap.medicalLogs)) {
          setMedicalLogs(snap.medicalLogs);
          if (snap.medicalLogs[0]?.id != null) setExpandedLogId(snap.medicalLogs[0].id);
        }
        // 记下服务端权威配置签名，随后的防抖保存据此判定「无需回写」
        lastCfgSigRef.current = configSignature({
          selectedPetId: petId,
          family: { elderName: snap.family?.elderName || "" },
          medications: snap.medications,
          familyMembers: snap.familyMembers,
          medicalLogs: snap.medicalLogs,
        });
        return true;
      };

      // 收到 Realtime 广播后重新拉一份权威快照（对端改了什么我不关心，直接以服务端为准）
      const refetchSnapshot = () => {
        cloudGet(familyId).then(s => { if (s) applyServerSnapshot(s, "rpc"); }).catch(() => {});
      };

      const selectedPetMeta = petCollection.find(p => p.selected) || petCollection[0];
      const visiblePets = isChangingPet ? petCollection : petCollection.filter(pet => pet.selected);
      const isCompactMobileStage = currentTab !== 'home';

      // ---- Hydrate from Supabase（离线兜底：localStorage）+ 订阅 Realtime ----
      useEffect(() => {
        let aborted = false;

        const seedFromLocal = () => {
          try {
            const localData = JSON.parse(
              localStorage.getItem(APP_DATA_STORAGE_KEY + ":" + familyId) ||
              localStorage.getItem(APP_DATA_STORAGE_KEY) || "null"
            );
            if (!localData) return;
            // 缓存可能是昨天（或更早）的：配置类数据（药品/家人/医嘱/宠物）照用，
            // 但服药勾选必须清空，否则次日离线打开会显示「今天都吃过了」→ 一整天零提醒。
            const stale = localData._cachedDate !== todayKey();
            const seed = stale
              ? {
                  ...localData,
                  lastTakeDate: undefined,   // 别让昨天的日期干扰 streak 判定
                  events: [],                // events 用于重建 takenSlots，陈旧的一律丢弃
                  medications: (localData.medications || []).map(m => ({ ...m, taken: false, takenSlots: [] })),
                  weeklyHistory: (localData.weeklyHistory || []).map(item => item.day === '今天' ? { ...item, done: 0 } : item),
                }
              : localData;
            applyServerSnapshot(seed, "local");
            if (stale) dayKeyRef.current = todayKey();
          } catch {}
        };

        const subscribe = () => {
          try { channelRef.current?.close(); } catch {}
          // 自己写的通知不回弹（self:false），只在对端改动时重新拉取
          channelRef.current = openFamilyChannel(familyId, () => { if (!aborted) refetchSnapshot(); });
        };

        const hydrate = async () => {
          setCloudStatus("loading");
          setCloudError("");
          try {
            const snap = await cloudGet(familyId);   // 家庭存在 → 快照；不存在 → null
            if (aborted) return;

            if (snap) {
              applyServerSnapshot(snap, "cloud");
              // 打上日期戳：次日离线打开时据此剥掉昨天的服药状态（见 seedFromLocal）
              try { localStorage.setItem(APP_DATA_STORAGE_KEY + ":" + familyId, JSON.stringify({ ...snap, _cachedDate: todayKey() })); } catch {}
              setCloudStatus("synced");
              appDataHydratedRef.current = true;
              subscribe();
              return;
            }

            // 家庭不存在
            if (familyId === DEMO_FAMILY_ID) {
              // 演示家庭：用静态种子首次建库（并发首访可能撞 family_exists，回退到重新拉取）
              try {
                const seedRes = await fetch('./clay-buddy-data.json', { cache: 'no-store' });
                const seed = seedRes.ok ? await seedRes.json() : {};
                let created;
                try {
                  created = await cloudCreateFamily(DEMO_FAMILY_ID, DEMO_PIN, {
                    displayName: "演示家庭", elderName: "妈妈",
                    payload: {
                      selectedPetId: seed.selectedPetId,
                      medications: seed.medications,
                      familyMembers: seed.familyMembers,
                      medicalLogs: seed.medicalLogs,
                    },
                  });
                } catch (e) {
                  if (/family_exists/.test(e.message || "")) created = await cloudGet(DEMO_FAMILY_ID);
                  else throw e;
                }
                if (aborted) return;
                if (created) applyServerSnapshot(created, "cloud");
                setCloudStatus("synced");
                appDataHydratedRef.current = true;
                subscribe();
              } catch (e) {
                console.warn("demo seed failed", e);
                seedFromLocal();
                setCloudStatus("error");
                setCloudError(String(e.message || e));
                appDataHydratedRef.current = true;
              }
              return;
            }

            // admin：弹创建流，状态正常；mom：设了 cloudError，要把状态也设为 error，否则守卫看不到
            if (viewMode === "admin") { setCreateFamilyOpen(true); setCloudStatus("synced"); }
            else { setCloudError("该链接对应的家庭还没有建好。请联系给你这个链接的家人。"); setCloudStatus("error"); }
            appDataHydratedRef.current = true;
            return;
          } catch (err) {
            console.warn("cloud GET failed, fallback to local", err);
            seedFromLocal();
            setCloudError(String(err.message || err));
            setCloudStatus("error");
            appDataHydratedRef.current = true;
          }
        };

        hydrate();
        return () => {
          aborted = true;
          try { channelRef.current?.close(); } catch {}
          channelRef.current = null;
        };
      }, [familyId]);

      // ---- 防抖保存配置（仅 admin/demo）+ localStorage 镜像 ----
      // 只覆盖「配置类」数据：药品、家人、医嘱、宠物换装。服药积分/健康/连续天数由
      // yb_log_dose 独占写入，不在这里回写，避免两条写路径打架。
      useEffect(() => {
        if (!appDataHydratedRef.current) return;
        const selectedPetId = (petCollection.find(pet => pet.selected) || selectedPetMeta)?.id;
        const payload = {
          selectedPetId,
          selectedPet: { level: selectedPet.level, points: selectedPet.points, healthIndex: selectedPet.healthIndex },
          // 关注对象的称呼（妈妈/爸爸/奶奶/老伴…）：服务端 yb_save_config 已支持 family.elderName
          family: { elderName },
          streakDays,
          lastTakeDate,
          medications,
          familyMembers,
          medicalLogs,
        };
        // localStorage 镜像 — 离线 fallback 用（带日期戳，次日读取时剥掉昨天的服药状态）
        try { localStorage.setItem(APP_DATA_STORAGE_KEY + ":" + familyId, JSON.stringify({ ...payload, _cachedDate: todayKey() })); } catch {}

        if (viewMode === "mom") return;                       // 妈妈端不写配置
        const pin = pinForWrite();
        if (!pin) return;                                     // 无 PIN（未创建/未授权）不写

        const sig = configSignature(payload);
        if (sig === lastCfgSigRef.current) return;            // 与服务端一致，无需回写

        if (writeTimerRef.current) clearTimeout(writeTimerRef.current);
        writeTimerRef.current = setTimeout(async () => {
          try {
            const snap = await cloudSaveConfig(familyId, payload, pin);
            lastCfgSigRef.current = sig;                       // 先记签名，避免 apply 的 setState 触发再存
            applyServerSnapshot(snap, "rpc");                  // 服务端把整数 id 换成 uuid，回填对齐
            channelRef.current?.notify();
            setCloudStatus("synced");
          } catch (err) {
            console.warn("cloud saveConfig failed", err);
            setCloudStatus("error");
            setCloudError(String(err.message || err));
          }
        }, 800);
        return () => { if (writeTimerRef.current) clearTimeout(writeTimerRef.current); };
        // petCollection 必须在依赖里：selectedPetId 是从它算出来的，
        // 少了它「换宠物」只改本地不回写云端（老人端下次拉快照就被覆盖回去）
      }, [selectedPet, petCollection, streakDays, lastTakeDate, medications, familyMembers, medicalLogs, elderName, familyId, adminPin, viewMode]);

      // -------- 服药提醒引擎：走时的钟 + 到点派发（F2.2）----------
      const [now, setNow] = useState(() => new Date());
      const [notifyPerm, setNotifyPerm] = useState(
        () => (typeof Notification !== "undefined" ? Notification.permission : "unsupported")
      );
      const notifiedRef = useRef({});   // 每个时段每天只提醒一次：key = 日期|药id|时段

      // 每 30s 走一次，同时挂载即对齐一次
      // 30s 心跳推进 now；同时检测「跨天」——老人的平板常整夜不关，
      // 一旦跨过 00:00 必须把昨天的服药勾选清空，否则当天 pending 全空 → 一整天零提醒（漏服安全问题）。
      useEffect(() => {
        const t = setInterval(() => {
          const d = new Date();
          const k = todayKey();
          if (k !== dayKeyRef.current) {
            dayKeyRef.current = k;
            // 新的一天：清空所有药的服用状态（服务端 dose_logs 按 local_date 存，不受影响）
            setMedications(prev => prev.map(m => ({ ...m, taken: false, takenSlots: [] })));
            notifiedRef.current = {};             // 通知去重表按天清空（key 含日期，清掉释放内存即可）
            setWeeklyHistory(prev => prev.map(item => item.day === '今天' ? { ...item, done: 0 } : item));
            refetchSnapshot();                    // 顺便拉一份当天权威快照
          }
          setNow(d);
        }, 30000);
        return () => clearInterval(t);
      }, []);

      // #11：新药拿到服务端 UUID 后（medications 被快照回写），补发之前暂存的服药日志
      useEffect(() => { flushPendingDoses(medications); }, [medications]);

      const reminders = useMemo(() => computeReminders(medications, now), [medications, now]);

      // F11.4：家人端定期拉取健康关心信号（老人语音陪伴时被静默记录）。仅 admin 端。
      useEffect(() => {
        if (viewMode !== "admin") return;
        let alive = true;
        const load = () => cloudHealthRecent(familyId, 14)
          .then((rows) => { if (alive && Array.isArray(rows)) setHealthSignals(rows); })
          .catch(() => {});
        load();
        const t = setInterval(load, 60000);
        return () => { alive = false; clearInterval(t); };
      }, [familyId, viewMode]);

      // F11.4：把原始信号收敛成家人端"健康关心"卡片数据。
      // 按 kind 去重取最新一条，最多 4 条，只保留近 14 天。措辞由 signalLabel 统一兜底为中性。
      const healthCare = useMemo(() => {
        const seen = new Set();
        const out = [];
        for (const s of healthSignals) {
          if (!s || seen.has(s.kind)) continue;
          seen.add(s.kind);
          out.push(s);
          if (out.length >= 4) break;
        }
        return out;
      }, [healthSignals]);
      // 关注对象的称呼：全局唯一来源。药宝不假设只服务「妈妈」——爸爸/奶奶/老伴/张阿姨都行。
      // 家人在【家庭配置 · 关注谁】里填，存云端 yb_families.elder_name，两端同步。
      const elderCall = (elderName || "").trim() || "妈妈";

      // 「上次喂食」从 events 流派生：服务端 yb_families 没有 last_feed 列，
      // 而 events 里每条 mom_take 都带 at（timestamptz），够算了 —— 不用改表，且两端同源。
      // 只认 taken:true 的最近一条；撤销（taken:false）不算喂食。
      const lastFeedLabel = useMemo(() => {
        const rows = (events || [])
          .filter(e => e && e.type === "mom_take" && e.taken)
          .map(e => new Date(e.at))
          .filter(d => !isNaN(d.getTime()))
          .sort((a, b) => b - a);
        if (!rows.length) return "还没有记录";
        const d = rows[0];
        const hm = `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
        const dayOf = (x) => `${x.getFullYear()}-${x.getMonth()}-${x.getDate()}`;
        const now = new Date();
        const yest = new Date(); yest.setDate(yest.getDate() - 1);
        if (dayOf(d) === dayOf(now)) {
          const mins = Math.floor((now - d) / 60000);
          if (mins < 1) return "刚刚 确认服药";
          if (mins < 60) return `${mins} 分钟前`;
          return `今天 ${hm}`;
        }
        if (dayOf(d) === dayOf(yest)) return `昨天 ${hm}`;
        return `${d.getMonth() + 1}/${d.getDate()} ${hm}`;
      }, [events, now]);

      // 到点派发：系统通知（若已授权）+ 应用内气泡提醒。每个时段每天只发一次。
      useEffect(() => {
        if (!appDataHydratedRef.current) return;
        const key = todayKey();
        let firstNew = null;
        for (const p of reminders.pending) {
          const k = `${key}|${p.med.id}|${p.refMin}`;
          if (notifiedRef.current[k]) continue;
          notifiedRef.current[k] = true;
          if (!firstNew) firstNew = p;
        }
        if (!firstNew) return;
        const medName = firstNew.med.name;
        const title = viewMode === "mom" ? "该吃药啦 💊" : `提醒：${elderCall}该吃「${medName}」了`;
        const body = viewMode === "mom"
          ? `现在是「${medName}」的服药时间，吃完记得点"我吃了"哦`
          : `${fmtHM(firstNew.refMin)} 的「${medName}」还没记录，去提醒一下${elderCall}吧`;
        if (typeof Notification !== "undefined" && Notification.permission === "granted") {
          try { new Notification(title, { body, tag: `yb-${firstNew.med.id}-${firstNew.refMin}` }); } catch {}
        }
        // 应用内提醒气泡（不依赖系统通知，微信内也生效）
        setBubbleText(viewMode === "mom"
          ? `主人，「${medName}」到点啦，我们一起把它吃掉好不好？💊`
          : `${elderCall}的「${medName}」到点还没吃哦`);
        // 语音朗读（若已开启且浏览器支持；首次需用户手势，之后自动）
        speak(viewMode === "mom" ? `该吃${medName}啦` : `${elderCall}该吃${medName}了`);
      }, [reminders, viewMode]);

      // 供 UI 高亮的到点药 id 集合
      const dueMedIds = useMemo(
        () => new Set(reminders.pending.map((p) => String(p.med.id))),
        [reminders]
      );

      // 请求系统通知授权（设置页按钮触发）
      const requestNotifyPermission = () => {
        if (typeof Notification === "undefined") { setNotifyPerm("unsupported"); showToast("当前环境不支持系统通知，应用内提醒仍会照常工作"); return; }
        Notification.requestPermission().then((p) => {
          setNotifyPerm(p);
          showToast(p === "granted" ? "🔔 已开启到点系统提醒" : "未开启系统通知，应用内提醒仍会工作");
        }).catch(() => showToast("开启失败，应用内提醒仍会工作"));
      };

      // 提醒条主文案（两端通用，措辞遵守 §6.3）
      const reminderLine = (() => {
        const { pending, upcoming } = reminders;
        if (pending.length) {
          const top = pending[0];
          const soft = top.overdue ? "别忘了" : "现在该吃";
          // pending 现在按「时段」拆分，同一种药可能占多条 —— 措辞按「药品种数」计，
          // 否则一种药的两剂会被说成「还有 1 种」，老人看不懂。
          const otherMeds = new Set(
            pending.filter(p => String(p.med.id) !== String(top.med.id)).map(p => String(p.med.id))
          ).size;
          const extra = otherMeds > 0 ? `（还有 ${otherMeds} 种也到点了）` : "";
          return viewMode === "mom"
            ? { tone: "due", text: `${soft}「${top.med.name}」${extra}`, med: top.med, slot: top.slot }
            : { tone: "due", text: `${elderCall}${soft}「${top.med.name}」${extra}`, med: top.med, slot: top.slot };
        }
        if (medications.length && medications.every((m) => m.taken)) {
          return { tone: "done", text: viewMode === "mom" ? "今天的药都吃完啦，真棒！🎉" : `${elderCall}今天的药都吃完啦 🎉`, med: null };
        }
        if (upcoming.length) {
          const n = upcoming[0];
          return { tone: "upcoming", text: `下一次服药 ${fmtHM(n.nextMin)} · ${n.med.name}`, med: null };
        }
        return null;
      })();

      // ================= 适老化无障碍（Task #6）=================
      // 字号 / 朗读 / 高对比是"这台设备、这个人"的偏好，本机持久化，与家庭云配置解耦：
      // 妈妈端无 PIN 也能自己调，且妈妈手机与家人手机各自独立、互不干扰。
      // mom 与 admin 是不同的页面加载，缩放根字号只影响当前这一个视图。
      const A11Y_KEY = "yb:a11y:" + (launch.family || "demo");
      const [a11y, setA11yState] = useState(() => {
        const base = { fontScale: "normal", voiceOn: true, highContrast: false };
        try { return { ...base, ...(JSON.parse(localStorage.getItem(A11Y_KEY) || "null") || {}) }; }
        catch { return base; }
      });
      const setA11y = (patch) => setA11yState((prev) => {
        const next = { ...prev, ...patch };
        try { localStorage.setItem(A11Y_KEY, JSON.stringify(next)); } catch {}
        return next;
      });

      // 根字号三档：标准 16 / 大 18 / 超大 20（用 rem-based 的 Tailwind 文本会整体放大）
      useEffect(() => {
        const px = { normal: "", large: "18px", huge: "20px" }[a11y.fontScale] || "";
        document.documentElement.style.fontSize = px;
        return () => { document.documentElement.style.fontSize = ""; };
      }, [a11y.fontScale]);

      // 高对比：加深灰字、强化描边（仅在开启时叠加，默认关闭，不改动原配色）
      useEffect(() => {
        document.body.classList.toggle("yb-hc", !!a11y.highContrast);
        return () => document.body.classList.remove("yb-hc");
      }, [a11y.highContrast]);

      // 语音朗读（TTS）。浏览器要求首个语音需用户手势触发，因此自动朗读在首次交互前
      // 可能被拦截——但手动🔊按钮始终有效，之后自动朗读也会放开。微信 X5 内核支持。
      const speak = (text) => {
        if (!a11y.voiceOn) return;
        try {
          if (typeof window.speechSynthesis === "undefined") return;
          const clean = String(text || "").replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}→✓•·⭐]/gu, "").trim();
          if (!clean) return;
          window.speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(clean);
          u.lang = "zh-CN"; u.rate = 0.95; u.pitch = 1.0;
          window.speechSynthesis.speak(u);
        } catch {}
      };
      const ttsSupported = typeof window !== "undefined" && typeof window.speechSynthesis !== "undefined";

      // ================= F11.1 会说话的小动物：语音情感陪伴 =================
      // 要解决的关键难题：老人不会打字 —— 输入方式对他们不可用。所以让他们「说话」。
      // 分层降级：① 浏览器 Web Speech API（zh-CN，最稳）→ ② MediaRecorder 录音 + 服务端 ASR
      // → ③ 都不行时，宠物仍用预置暖心话陪伴（demo 永远有回应）。
      const AI_CODE = launch.family || DEMO_FAMILY_ID; // 家庭码即调用闸门
      const [aiPhase, setAiPhase] = useState("idle");  // idle | listening | thinking
      const [micState, setMicState] = useState("unknown"); // unknown | denied | unsupported
      const aiPhaseRef = useRef("idle");
      const recRef = useRef(null); // { type:'speech'|'media', obj, stream? }
      const talkingRef = useRef(false);
      const mediaHandoffRef = useRef(false); // SR 出错后是否已交棒给 MediaRecorder（供 onend 判别，避免竞态双跑）
      const setPhase = (p) => { aiPhaseRef.current = p; setAiPhase(p); };

      // 拿到一句话文本后：调宠物人格对话，成功用回复、失败用兜底文案，都会朗读。
      const aiReply = async (userText, audioMs) => {
        setPhase("thinking");
        setBubbleText("让我想想…💭");
        const res = await callAI({
          op: "chat", code: AI_CODE, text: userText, audioMs: audioMs || null,
          petName: selectedPet.name, elderName: elderName || "", localDate: todayKey(),
        }, 15000);
        // 降级兜底分两级（#6）：先看这句话里有没有身体不适信号。
        // 有 → 用「引导就医 + 会转达家人」话术（F11.6:511 硬要求）；没有 → 随机暖心话。
        const localKind = detectLocalSignal(userText);
        const fallback = localKind ? (CARE_REPLIES[localKind] || pickFallbackReply()) : pickFallbackReply();
        const raw = (res && res.ok && res.reply) ? res.reply : fallback;
        // F11.6 兜底：宠物对老人说的话若含医疗红线词，整句丢弃换安全话术（老人端不该看到「【已过滤】」）
        const reply = MEDICAL_REDLINE.some(w => String(raw).includes(w)) ? fallback : raw;
        setBubbleText(reply);
        setPetReactState("happy");
        setTimeout(() => setPetReactState("idle"), 1600);
        speak(reply);
        setPhase("idle");
      };

      const finishNoSpeech = () => {
        talkingRef.current = false; recRef.current = null;
        setPhase("idle");
        setBubbleText("没听清呀，再按住我说一次好不好？");
      };

      // ② MediaRecorder 录音 → 服务端 ASR
      const startMediaCapture = async () => {
        const canMedia = typeof navigator !== "undefined" && navigator.mediaDevices &&
          navigator.mediaDevices.getUserMedia && typeof window.MediaRecorder !== "undefined";
        if (!canMedia) {
          setMicState("unsupported");
          talkingRef.current = false; setPhase("idle");
          // 没有任何语音能力时，点一下也给一句暖心陪伴，demo 不至于「哑巴」
          const line = pickFallbackReply();
          setBubbleText(line); speak(line);
          return;
        }
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          // 关键：授权/交棒期间用户可能已松手 —— 若已松手，立刻释放麦克风，杜绝录音红点常亮
          if (!talkingRef.current) {
            try { stream.getTracks().forEach((t) => t.stop()); } catch {}
            recRef.current = null;
            setPhase("idle");
            setBubbleText("按住我，说完再松开就好啦~");
            return;
          }
          const mime = window.MediaRecorder.isTypeSupported && window.MediaRecorder.isTypeSupported("audio/webm")
            ? "audio/webm" : "";
          const mr = new window.MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
          const chunks = []; const startedAt = Date.now();
          mr.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
          mr.onstop = async () => {
            try { stream.getTracks().forEach((t) => t.stop()); } catch {}
            talkingRef.current = false; recRef.current = null;
            const audioMs = Date.now() - startedAt;
            if (!chunks.length) { finishNoSpeech(); return; }
            // 按住太短（通常是轻点而非按住）→ 引导正确手势，不把空音频发给 ASR（防老人轻点导致"哑火"）
            if (audioMs < 500) {
              const line = "要按住我一直说，说完再松开哦~ 🎤";
              setBubbleText(line); speak(line); setPhase("idle");
              return;
            }
            setPhase("thinking"); setBubbleText("让我听听你说的…👂");
            const blob = new Blob(chunks, { type: mr.mimeType || "audio/webm" });
            const b64 = await blobToBase64(blob);
            const fmt = (mr.mimeType || "webm").includes("mp4") ? "mp4" : "webm";
            const asr = await callAI({ op: "asr", code: AI_CODE, audioBase64: b64, format: fmt }, 20000);
            const said = (asr && asr.ok && asr.text) ? String(asr.text).trim() : "";
            if (said) { aiReply(said, audioMs); }
            else {
              // 转写不可用（Key 未配置/超时）：拿不到文本就无法识别不适信号，
              // 所以话术里主动留一句「不舒服要告诉家人」，别让这条路把关心弄丢了。
              const line = "我听见你的声音啦，就是没太听清呢。要是身体不舒服，一定要告诉家人哦 💛";
              setBubbleText(line); speak(line); setPhase("idle");
            }
          };
          recRef.current = { type: "media", obj: mr, stream };
          setMicState("ok"); setPhase("listening"); setBubbleText("我在听…🎙️ 松开就好");
          mr.start();
        } catch (e) {
          setMicState("denied");
          talkingRef.current = false; setPhase("idle");
          setBubbleText("要允许用麦克风，我才能听你说话哦~");
        }
      };

      // ① Web Speech API（首选）
      const startListening = () => {
        if (talkingRef.current) return;
        talkingRef.current = true;
        mediaHandoffRef.current = false; // 新一次按住：清掉上次的交棒标记
        const SR = (typeof window !== "undefined") && (window.SpeechRecognition || window.webkitSpeechRecognition);
        if (SR) {
          try {
            const rec = new SR();
            rec.lang = "zh-CN"; rec.interimResults = true; rec.maxAlternatives = 1; rec.continuous = false;
            let finalText = "";
            rec.onresult = (e) => {
              finalText = "";
              for (let i = 0; i < e.results.length; i++) finalText += e.results[i][0].transcript;
              if (finalText) setBubbleText("我听到：" + finalText);
            };
            rec.onerror = () => {
              // 常见于微信内核不放行 —— 无缝转 MediaRecorder 方案
              recRef.current = null;
              if (talkingRef.current) {
                mediaHandoffRef.current = true;  // 标记已交棒，onend 不得再跑
                startMediaCapture();
              } else {
                setPhase("idle");  // 用户已松手：别卡在 listening 脉冲
              }
            };
            rec.onend = () => {
              if (recRef.current && recRef.current.type === "speech") recRef.current = null;
              // 若 onerror 已交棒给 media，这条 onend 空转（守卫竞态双跑）
              if (mediaHandoffRef.current) return;
              if (aiPhaseRef.current !== "listening") return;
              const t = (finalText || "").trim();
              talkingRef.current = false;
              if (t) aiReply(t, null); else finishNoSpeech();
            };
            recRef.current = { type: "speech", obj: rec };
            setMicState("ok"); setPhase("listening"); setBubbleText("我在听…🎙️ 松开就好");
            rec.start();
            return;
          } catch (e) { /* 转下一层 */ }
        }
        startMediaCapture();
      };

      const stopListening = () => {
        // 松手即置位：这是「用户已松手」的权威信号。
        // 即便录音器还没建好（recRef 仍为 null，正卡在授权/交棒的 await 里），
        // startMediaCapture 的 await 后复检也能据此立刻释放麦克风。
        talkingRef.current = false;
        const cur = recRef.current;
        if (!cur) return;
        try { cur.obj.stop(); } catch {}
      };

      // -------- Mom view: 妈妈这一端，零 onboarding，大字 ----------
      if (viewMode === 'mom') {
        const takenCount = medications.filter(m => m.taken).length;
        const total = medications.length;
        const remaining = total - takenCount;
        const today = new Date();
        const todayLabel = `${today.getMonth() + 1} 月 ${today.getDate()} 日`;
        const weekdays = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
        const weekday = weekdays[today.getDay()];
        const recentNotes = events.filter(e => e.type === 'admin_note').slice(0, 3);

        if (cloudError) {
          return (
            <div className="min-h-screen w-full flex items-center justify-center p-8 bg-rose-50">
              <div className="clay-surface-soft p-6 max-w-md text-center space-y-3">
                <p className="text-3xl">💌</p>
                <p className="text-lg font-black text-slate-800">这个药宝还没准备好</p>
                <p className="text-sm text-slate-600 leading-relaxed font-bold">请联系把这个链接发给你的家人，让 ta 在家庭配置里准备好你的药品。</p>
              </div>
            </div>
          );
        }

        return (
          <div className="w-full min-h-screen flex flex-col bg-gradient-to-b from-rose-50 via-amber-50 to-orange-50">
            {/* Toast */}
            {toastMsg && (
              <div className="fixed top-6 left-1/2 -translate-x-1/2 z-50 bg-rose-500 text-white font-bold px-6 py-4 rounded-2xl shadow-2xl text-base max-w-[90%]">
                {toastMsg}
              </div>
            )}

            <header className="px-6 pt-10 pb-4 text-center">
              {/* 角色徽标：一眼区分这是老人端 */}
              <div className="mb-3 flex justify-center">
                <span className="inline-flex items-center gap-1.5 text-sm font-black bg-white/70 text-rose-500 px-4 py-1.5 rounded-full shadow-sm border border-rose-100">
                  👵 {elderCall}的药宝
                </span>
              </div>
              <p className="text-base font-bold text-slate-500">{todayLabel} · {weekday}</p>
              <h1 className="mt-2 text-3xl font-black text-slate-800 leading-tight">
                {familyMembers.length > 0 ? "为你准备好的药宝" : "今天的药宝"}
              </h1>
              <p className="mt-3 text-xl font-black text-rose-500">
                {remaining > 0 ? `今天还要吃 ${remaining} 片药` : "今天的药都吃完啦！🎉"}
              </p>
            </header>

            {/* 3D pet stage — bigger */}
            <div className="mx-4 mb-4 rounded-[2rem] bg-white/60 backdrop-blur-sm shadow-inner overflow-hidden" style={{ height: 260 }}>
              <ClayPet3D petId={selectedPet.id} petState={petVisualState} bubbleText={bubbleText} onPetClick={handlePetClick} />
            </div>

            {/* Bubble text */}
            <div className="mx-6 mb-4 px-5 py-3 bg-white rounded-3xl shadow-sm border border-rose-100">
              <p className="text-base font-bold text-slate-700 leading-relaxed text-center">{bubbleText}</p>
            </div>

            {/* F11.1 按住说话：老人不会打字，说话是唯一自然的输入 */}
            <div className="mx-6 mb-5">
              <button
                onMouseDown={(e) => { e.preventDefault(); startListening(); }}
                onMouseUp={(e) => { e.preventDefault(); stopListening(); }}
                onMouseLeave={() => { if (aiPhase === 'listening') stopListening(); }}
                onTouchStart={(e) => { e.preventDefault(); startListening(); }}
                onTouchEnd={(e) => { e.preventDefault(); stopListening(); }}
                disabled={aiPhase === 'thinking'}
                className={`w-full min-h-[72px] rounded-3xl text-2xl font-black transition-all active:scale-95 shadow-lg flex items-center justify-center gap-3 select-none ${
                  aiPhase === 'listening' ? 'bg-rose-600 text-white animate-pulse'
                  : aiPhase === 'thinking' ? 'bg-slate-300 text-slate-600'
                  : 'clay-btn-primary text-white'}`}
                style={{ touchAction: 'none' }}
              >
                {aiPhase === 'listening' ? '🎙️ 松开就好' : aiPhase === 'thinking' ? '💭 想一想…' : '🎤 按住和我说话'}
              </button>
              {micState === 'denied' && (
                <p className="mt-2 text-sm font-bold text-amber-600 text-center">要允许麦克风才能听你说话哦</p>
              )}
              {micState === 'unsupported' && (
                <p className="mt-2 text-xs font-bold text-slate-400 text-center">这个手机不支持录音，我还是会陪你聊两句~</p>
              )}
              {/* F11.6 医疗免责：AI 陪伴不是医生。措辞遵守 §6.3，温和不制造焦虑 */}
              <p className="mt-3 text-xs font-bold text-slate-400 text-center leading-relaxed">
                我只是陪你说说话的小伙伴，不能替代医生哦。<br />身体不舒服，记得告诉家人、及时看医生 💛
              </p>
            </div>

            {/* 到点提醒条（F2.2）—— 措辞遵守 §6.3，不指责、不制造焦虑 */}
            {reminderLine && (
              <div className={`mx-6 mb-4 rounded-3xl p-5 border-2 ${
                reminderLine.tone === 'due' ? 'bg-rose-500 border-rose-500 shadow-lg'
                : reminderLine.tone === 'done' ? 'bg-emerald-50 border-emerald-200'
                : 'bg-white border-slate-100'}`}>
                <div className="flex items-center gap-3">
                  <span className="text-3xl shrink-0">{reminderLine.tone === 'due' ? '🔔' : reminderLine.tone === 'done' ? '🎉' : '⏰'}</span>
                  <p className={`flex-1 text-xl font-black leading-snug ${reminderLine.tone === 'due' ? 'text-white' : 'text-slate-800'}`}>
                    {reminderLine.text}
                  </p>
                  {ttsSupported && (
                    <button
                      onClick={() => speak(reminderLine.text)}
                      aria-label="朗读提醒"
                      className={`shrink-0 w-14 h-14 rounded-2xl flex items-center justify-center text-2xl active:scale-90 transition-all ${reminderLine.tone === 'due' ? 'bg-white/25 text-white' : 'bg-rose-50 text-rose-500'}`}
                    >
                      🔊
                    </button>
                  )}
                </div>
                {reminderLine.tone === 'due' && reminderLine.med && (
                  <button
                    onClick={() => handleTakeMedication(reminderLine.med.id, reminderLine.slot)}
                    className="mt-4 w-full py-5 rounded-2xl text-2xl font-black bg-white text-rose-600 shadow active:scale-95 transition-all"
                  >
                    我 吃 了
                  </button>
                )}
              </div>
            )}

            {/* Med list — big buttons */}
            <div className="px-6 space-y-4 pb-6">
              {medications.map(med => {
                const takenSlots = med.takenSlots || (med.taken ? (med.times || []) : []);
                const allDone = med.taken;
                const someDone = !allDone && takenSlots.length > 0;
                const cardBg = allDone
                  ? 'bg-emerald-100/70 border-2 border-emerald-200'
                  : someDone
                  ? 'bg-amber-50 border-2 border-amber-200'
                  : dueMedIds.has(String(med.id))
                  ? 'bg-white border-2 border-rose-300 ring-4 ring-rose-200/60 shadow-lg'
                  : 'bg-white border-2 border-rose-100 shadow-md';
                return (
                  <div key={med.id} className={`rounded-3xl p-5 ${cardBg}`}>
                    <div className="flex items-center gap-4">
                      <div className="w-14 h-14 rounded-2xl bg-white flex items-center justify-center text-3xl shadow-sm shrink-0">{med.icon}</div>
                      <div className="flex-1 min-w-0">
                        <p className={`text-lg font-black ${allDone ? 'line-through text-emerald-700' : 'text-slate-800'}`}>{med.name}</p>
                        <p className="text-sm font-bold text-slate-500 mt-0.5">{med.dose}</p>
                      </div>
                    </div>
                    {(med.times || []).length > 1 ? (
                      // 多剂次：每个时段各一个按钮，独立判定，不再因为早上吃了就藏掉晚上那剂
                      <div className="mt-4 grid grid-cols-2 gap-3">
                        {med.times.map(t => {
                          const slotDone = takenSlots.includes(t);
                          return (
                            <button key={t}
                              onClick={() => handleTakeMedication(med.id, t)}
                              className={`py-4 rounded-2xl text-base font-black transition-all active:scale-95 ${slotDone ? 'bg-emerald-200 text-emerald-700' : 'clay-btn-primary text-white shadow-lg'}`}
                            >
                              {slotDone ? `✓ ${t} 已吃` : `${t} 我吃了`}
                            </button>
                          );
                        })}
                      </div>
                    ) : (
                      // 单剂次：整个药一键确认
                      <button
                        onClick={() => handleTakeMedication(med.id)}
                        className={`mt-4 w-full py-5 rounded-2xl text-xl font-black transition-all active:scale-95 ${allDone ? 'bg-emerald-200 text-emerald-700' : 'clay-btn-primary text-white shadow-lg'}`}
                      >
                        {allDone ? "✓ 已吃了" : "我 吃 了"}
                      </button>
                    )}
                  </div>
                );
              })}
              {medications.length === 0 && (
                <div className="bg-white rounded-3xl p-6 text-center border-2 border-rose-100">
                  <p className="text-base font-bold text-slate-500">今天没有要吃的药~</p>
                  <p className="text-xs text-slate-400 mt-2">如果是你家人没安排，请提醒他/她去配置</p>
                </div>
              )}
            </div>

            {/* Family notes */}
            {recentNotes.length > 0 && (
              <div className="mx-6 mb-6 rounded-3xl bg-rose-50/80 border-2 border-rose-100 p-5 space-y-3">
                <p className="text-base font-black text-rose-600 flex items-center gap-2">
                  <MessageSquare className="w-5 h-5" /> 今日家人留言
                </p>
                {recentNotes.map(n => (
                  <div key={n.id} className="bg-white rounded-2xl p-3 shadow-sm">
                    <p className="text-sm font-black text-rose-500 mb-1">{n.author}</p>
                    <p className="text-base font-bold text-slate-700 leading-relaxed">{n.text}</p>
                  </div>
                ))}
              </div>
            )}

            {/* Streak chip */}
            <div className="mx-6 mb-6 rounded-3xl bg-amber-50/80 border-2 border-amber-100 p-5 text-center">
              <p className="text-xs font-bold text-amber-700">已经坚持</p>
              <p className="text-4xl font-black text-amber-600 mt-1">{streakDays} 天</p>
              <p className="text-sm font-bold text-amber-700 mt-2">{selectedPet.name} 也一天天地胖起来啦~</p>
            </div>

            {/* 适老化：看不清 / 听不清就点这里（Task #6，本机记忆） */}
            <div className="mx-6 mb-10 rounded-3xl bg-white border-2 border-slate-100 p-5 space-y-4">
              <p className="text-base font-black text-slate-600 text-center">看不清？在这里调大字</p>
              <div className="grid grid-cols-3 gap-3">
                {[['normal','标准'],['large','大'],['huge','超大']].map(([val,label]) => (
                  <button
                    key={val}
                    onClick={() => setA11y({ fontScale: val })}
                    className={`min-h-[56px] rounded-2xl font-black transition-all active:scale-95 border-2 ${
                      a11y.fontScale === val ? 'bg-rose-500 text-white border-rose-500 shadow' : 'bg-white text-slate-600 border-slate-200'}`}
                    style={{ fontSize: val === 'huge' ? 22 : val === 'large' ? 19 : 16 }}
                  >
                    {label}
                  </button>
                ))}
              </div>
              {ttsSupported && (
                <button
                  onClick={() => { const next = !a11y.voiceOn; setA11y({ voiceOn: next }); if (next) window.setTimeout(() => { try { const u = new SpeechSynthesisUtterance("已开启语音朗读"); u.lang = "zh-CN"; window.speechSynthesis.speak(u); } catch {} }, 60); else { try { window.speechSynthesis.cancel(); } catch {} } }}
                  className={`w-full min-h-[56px] rounded-2xl font-black text-lg transition-all active:scale-95 border-2 flex items-center justify-center gap-2 ${
                    a11y.voiceOn ? 'bg-emerald-500 text-white border-emerald-500 shadow' : 'bg-white text-slate-500 border-slate-200'}`}
                >
                  {a11y.voiceOn ? '🔊 语音朗读：已开' : '🔇 语音朗读：已关'}
                </button>
              )}
            </div>
          </div>
        );
      }

      // -------- Admin view（原全功能视图） ----------
      return (
        <div className="w-full flex-grow flex flex-col items-center justify-start mobile-safe-shell">

          {/* Toast Notification Container */}
          {toastMsg && (
            <div className="fixed top-8 left-1/2 -translate-x-1/2 z-50 clay-surface-soft bg-rose-50 border-rose-300 text-rose-700 font-bold px-6 py-3.5 flex items-center gap-2.5 animate-bounce shadow-xl text-sm max-w-[90%]">
              <Sparkles className="w-5 h-5 text-rose-400 shrink-0" />
              <span>{toastMsg}</span>
            </div>
          )}

          {/* Root Shell layout responsive system */}
          <div className="w-full max-w-[1280px] min-h-screen grid grid-cols-1 lg:grid-cols-12 gap-0 lg:gap-8 px-0 sm:px-4 lg:px-8 py-0 lg:py-6 relative">
            
            {/* Desktop Left-persistent Dynamic Navigation Sidebar */}
            <aside className="hidden lg:col-span-3 lg:flex flex-col gap-6 h-fit sticky top-6">
              <div className="clay-surface-soft p-6 flex flex-col gap-6">
                
                {/* Brand Identity */}
                <div className="flex items-center gap-3.5">
                  <div className="w-12 h-12 rounded-2xl bg-gradient-to-br from-orange-300 to-rose-400 p-0.5 shadow-md flex items-center justify-center text-white">
                    <Heart className="w-6 h-6 fill-white" />
                  </div>
                  <div>
                    <h1 className="text-xl font-black text-slate-800 tracking-tight flex items-center gap-1.5">
                      PillPal <span className="text-rose-400">药宝</span>
                    </h1>
                    <p className="text-xs font-semibold text-slate-400 uppercase tracking-widest mt-0.5">你的有爱服药主理人</p>
                  </div>
                </div>

                {/* Profile card and Health Indexes status */}
                <div className="clay-surface-sunken p-4 flex flex-col gap-3">
                  <div className="flex items-center justify-between">
                    <span className="text-xs text-slate-500 font-bold">{selectedPet.name}的健康力</span>
                    <span className="text-xs text-emerald-500 font-black">{selectedPet.healthIndex}%</span>

                                <button onClick={() => { try { navigator.clipboard.writeText(momUrl); showToast(`📋 已复制，去微信发给${elderCall}`); } catch { showToast("复制失败"); } }} className="clay-btn-secondary px-3 py-2 text-xs font-black shrink-0">复制</button>
                              </div>
                              <p className="text-xs text-slate-500 font-bold">{elderCall}打开这个链接就是为{elderCall}准备好的大字版药宝，只用点"我吃了"。</p>
                              <p className="text-xs text-slate-400">
                                <a href={`https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(momUrl)}`} target="_blank" rel="noopener" className="underline text-rose-500 font-bold">查看二维码</a> · 让{elderCall}用相机扫描
                              </p>
                            </>
                          );
                        })()}
                        {adminPin && (
                          <details className="text-xs">
                            <summary className="cursor-pointer text-slate-500 font-bold">查看 admin PIN（用于在新设备上接管）</summary>
                            <div className="mt-2 flex gap-2 items-center">
                              <code className="flex-1 px-2 py-1.5 bg-slate-50 rounded text-slate-700">{adminPin}</code>
                              <button onClick={() => { try { navigator.clipboard.writeText(adminPin); showToast("已复制 PIN"); } catch {} }} className="clay-btn-secondary px-2 py-1 text-xs font-black">复制</button>
                            </div>
                            <p className="text-slate-400 mt-1">PIN 自动存在你这台设备上。要在新设备登录这个家庭，需要这个码。</p>
                          </details>
                        )}
                      </div>
                    )}

                    {/* Family members CRUD */}
                    <div className="clay-surface-sunken p-4 rounded-2xl space-y-3">
                      <p className="text-xs font-black text-slate-700">家庭成员</p>
                      <div className="space-y-2">
                        {familyMembers.map(m => (
                          <div key={m.id} className="flex items-center gap-2 bg-white rounded-xl p-2.5 border border-slate-100">
                            <span className="text-xl">{m.avatar}</span>
                            <div className="flex-1 min-w-0">
                              <p className="text-xs font-black text-slate-700 truncate">{m.relation} {m.name}</p>
                              <p className="text-xs text-slate-400 truncate">{m.permission || "可查看与留言"}</p>
                            </div>
                            <button onClick={() => setFamilyMembers(prev => prev.filter(x => x.id !== m.id))} className="text-slate-300 hover:text-rose-400">
                              <Trash2 className="w-3.5 h-3.5" />
                            </button>
                          </div>
                        ))}
                        {familyMembers.length === 0 && <p className="text-xs text-slate-400 font-bold text-center py-2">还没有家人 — 加一个吧</p>}
                      </div>
                      <form onSubmit={(e) => {
                        e.preventDefault();
                        const name = (newMemberName || "").trim();
                        const relation = (newMemberRelation || "").trim();
                        if (!name) { showToast("名字不能空"); return; }
                        const nm = { id: Date.now(), name, relation: relation || "家人", avatar: newMemberAvatar || "👤", status: "已绑定", permission: "可查看健康值、服药历史、留言" };
                        setFamilyMembers(prev => [...prev, nm]);
                        setNewMemberName(""); setNewMemberRelation(""); setNewMemberAvatar("👤");
                        showToast("✅ 已添加家庭成员");
                      }} className="space-y-2">
                        {/* 注意：sm: 断点看视口不看容器，侧栏只有约 380px，四控件一行会挤成截图里那样 —— 分行 */}
                        <div className="flex items-center gap-2">
                          <select value={newMemberAvatar} onChange={e => setNewMemberAvatar(e.target.value)} className="px-2 py-2 clay-input-soft text-base focus:outline-none shrink-0">
                            {["👩","👨","👧","👦","👴","👵","🧒","👤"].map(em => <option key={em} value={em}>{em}</option>)}
                          </select>
                          <input value={newMemberRelation} onChange={e => setNewMemberRelation(e.target.value)} placeholder="关系（如：女儿）" className="flex-1 min-w-0 px-3 py-2.5 clay-input-soft text-xs font-bold focus:outline-none" />
                        </div>
                        <input value={newMemberName} onChange={e => setNewMemberName(e.target.value)} placeholder="名字（如：露露）" className="w-full px-3 py-2.5 clay-input-soft text-xs font-bold focus:outline-none" />
                        <button type="submit" className="w-full clay-btn-primary py-2.5 text-xs font-black">＋ 添加家人</button>
                      </form>
                    </div>

                    <div className="bg-amber-50 rounded-2xl p-3 border border-amber-100 text-xs text-amber-700 font-bold leading-relaxed">
                      💡 在这里把{elderCall}的药品、家人、宠物都准备好，然后把专用链接发给{elderCall} — {elderCall}打开就是大字版的"我吃了"按钮，不需要学新东西。
                    </div>
                  </div>
                )}

              </div>
            </section>

          </div>

          {/* Achievement Share Modal */}
          {achievementShare && (
            <div className="fixed inset-0 z-50 bg-slate-900/25 backdrop-blur-sm flex items-center justify-center p-5">
              <div className="clay-surface-soft max-w-sm w-full p-6 text-center space-y-4">
                <div className="mx-auto w-20 h-20 rounded-[2rem] bg-gradient-to-br from-amber-200 to-rose-300 flex items-center justify-center shadow-lg text-4xl pet-float">🏆</div>
                <div>
                  <p className="text-xs font-black text-rose-500 tracking-widest uppercase">Community Share Card</p>
                  <h3 className="text-2xl font-black text-slate-800 mt-1">连续打卡 {achievementShare.days} 天</h3>
                  <p className="text-sm text-slate-500 font-bold mt-2 leading-relaxed">{achievementShare.pet}已经被你喂得元气满满！这张成就卡可以发给社区，邀请大家一起规律服药。</p>
                </div>
                <div className="bg-gradient-to-r from-rose-50 to-amber-50 rounded-2xl p-4 border border-rose-100 text-left">
                  <p className="text-xs font-black text-slate-700">#药宝打卡挑战</p>
                  <p className="text-xs text-slate-500 font-semibold mt-1">我和黏土小动物一起完成了 {achievementShare.days} 天服药守护。</p>
                </div>
                <div className="grid grid-cols-2 gap-3">
                  <button onClick={() => { showToast('分享文案已准备好，可发布到社区'); setAchievementShare(null); }} className="clay-btn-primary py-3 text-sm font-black flex items-center justify-center gap-2"><Share2 className="w-4 h-4" />发给社区</button>
                  <button onClick={() => setAchievementShare(null)} className="clay-btn-secondary py-3 text-sm font-black text-slate-600">稍后再说</button>
                </div>
              </div>
            </div>
          )}

          {/* Create Family modal */}
          {createFamilyOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-5">
              <div className="clay-surface-soft max-w-md w-full p-6 space-y-4">
                <div className="text-center space-y-2">
                  <p className="text-3xl">🏡</p>
                  <h3 className="text-xl font-black text-slate-800">为{elderCall}创建一个专属家庭</h3>
                  <p className="text-xs text-slate-500 font-bold leading-relaxed">
                    系统会生成一个家庭码和一个 admin PIN。<br/>
                    家庭码 = {elderCall}版链接的一部分；PIN 自动存在你这台设备上。
                  </p>
                </div>
                <div className="bg-rose-50 rounded-2xl p-4 border border-rose-100 text-xs text-rose-700 font-bold leading-relaxed">
                  ⚠️ PIN 只在你这台设备上保存。要在新设备打开 admin 视角，需要这个 PIN。建议截图保存或抄一份。
                </div>
                <div className="grid grid-cols-2 gap-3">
                  <button onClick={() => setCreateFamilyOpen(false)} className="clay-btn-secondary py-3 text-sm font-black text-slate-600">先不用</button>
                  <button onClick={async () => {
                    const newFamily = generateFamilyId();
                    const newPin = generateAdminPin();
                    const selectedPetId = (petCollection.find(pet => pet.selected) || selectedPetMeta)?.id;
                    try {
                      // 用当前本地配置做种子建库；服务端建表并回吐权威快照
                      const snap = await cloudCreateFamily(newFamily, newPin, {
                        displayName: "我们家", elderName: "妈妈",
                        payload: { selectedPetId, medications, familyMembers, medicalLogs },
                      });
                      writeLocalAdminPin(newFamily, newPin);
                      setFamilyId(newFamily);
                      setAdminPin(newPin);
                      applyServerSnapshot(snap, "rpc");
                      setCreateFamilyOpen(false);
                      setCurrentTab('settings');
                      // 修改 URL 不刷新
                      try {
                        const u = new URL(window.location.href);
                        u.searchParams.set('family', newFamily);
                        u.searchParams.set('as', 'admin');
                        window.history.replaceState({}, '', u.toString());
                      } catch {}
                      showToast(`🏡 家庭已创建！去配置 tab 把${elderCall}版链接发出去`);
                    } catch (err) {
                      showToast("创建失败：" + (err.message || ""));
                    }
                  }} className="clay-btn-primary py-3 text-sm font-black">立刻创建</button>
                </div>
              </div>
            </div>
          )}

          {/* Sticky Bottom Tab Bar - Mobile layout ONLY */}
          <footer className="fixed bottom-0 inset-x-0 bg-white/95 backdrop-blur-md border-t border-slate-100 lg:hidden px-6 py-4 flex items-center justify-between z-40 shadow-[0_-8px_24px_rgba(180,190,210,0.15)] rounded-t-[2rem]">
            <button 
              onClick={() => setCurrentTab('home')}
              className={`flex flex-col items-center gap-1.5 transition-all text-xs font-black ${currentTab === 'home' ? 'text-rose-500 scale-105' : 'text-slate-400'}`}
            >
              <Smile className="w-5 h-5" />
              <span>{selectedPet.name}主屏</span>
            </button>

            <button 
              onClick={() => setCurrentTab('medication')}
              className={`flex flex-col items-center gap-1.5 transition-all text-xs font-black ${currentTab === 'medication' ? 'text-rose-500 scale-105' : 'text-slate-400'}`}
            >
              <Pill className="w-5 h-5" />
              <span>安排药片</span>
            </button>

            <button 
              onClick={() => setCurrentTab('doctor')}
              className={`flex flex-col items-center gap-1.5 transition-all text-xs font-black ${currentTab === 'doctor' ? 'text-rose-500 scale-105' : 'text-slate-400'}`}
            >
              <ClipboardCheck className="w-5 h-5" />
              <span>医嘱日记</span>
            </button>

            <button
              onClick={() => setCurrentTab('family')}
              className={`flex flex-col items-center gap-1.5 transition-all text-xs font-black ${currentTab === 'family' ? 'text-rose-500 scale-105' : 'text-slate-400'}`}
            >
              <Users className="w-5 h-5" />
              <span>加点爱</span>
            </button>

            <button
              onClick={() => setCurrentTab('settings')}
              className={`flex flex-col items-center gap-1.5 transition-all text-xs font-black ${currentTab === 'settings' ? 'text-rose-500 scale-105' : 'text-slate-400'}`}
            >
              <Settings className="w-5 h-5" />
              <span>配置</span>
            </button>
          </footer>

        </div>
      );
    }

    // ErrorBoundary: 任何未捕获错误（如 Three.js 加载失败后 new THREE.Scene()）都不会白屏
    // 降级显示中文纯文本药单，老人仍能看到药名
    class ErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { crashed: false }; }
      static getDerivedStateFromError() { return { crashed: true }; }
      componentDidCatch(err, info) { console.error("[药宝] App crashed:", err, info); }
      render() {
        if (this.state.crashed) {
          return (
            <div style={{ minHeight: '100vh', background: '#fff7f0', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: '32px', fontFamily: 'sans-serif' }}>
              <p style={{ fontSize: 48, marginBottom: 16 }}>💊</p>
              <p style={{ fontSize: 22, fontWeight: 900, color: '#be123c', marginBottom: 12 }}>页面遇到了小问题</p>
              <p style={{ fontSize: 16, color: '#475569', marginBottom: 24, textAlign: 'center', lineHeight: 1.7 }}>请告诉你的家人，让 ta 来帮你重新打开。<br/>你可以先点下面的按钮试试。</p>
              <button onClick={() => window.location.reload()} style={{ background: '#f43f5e', color: '#fff', border: 'none', borderRadius: 16, padding: '16px 40px', fontSize: 18, fontWeight: 900, cursor: 'pointer' }}>
                重新加载 🔄
              </button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // Initialize root React app safely inside root tag
    const container = document.getElementById('root');
    const root = createRoot(container);
    root.render(<ErrorBoundary><App /></ErrorBoundary>);
  </script>
</body>
</html>
