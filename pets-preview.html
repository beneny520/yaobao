<script>
const PET_SPECS = {
      bunny:   { emoji: '🐰', body: 0xfffcf7, accent: 0xf79b83, alt: 0xfff1ea, fit: 0.88 },
      bear:    { emoji: '🐻', body: 0xfaeacd, accent: 0xf79b83, alt: 0xffdcb0, fit: 0.92 },
      cat:     { emoji: '🐱', body: 0xffe4cc, accent: 0xf79b83, alt: 0xfffcf7, fit: 0.92 },
      dog:     { emoji: '🐶', body: 0xfffcf7, accent: 0xf79b83, alt: 0xcfe6f5, fit: 0.94 },
      penguin: { emoji: '🐧', body: 0xaebbd6, accent: 0xf79b83, alt: 0xfffcf7, fit: 0.92 },
      fox:     { emoji: '🦊', body: 0xffc9a5, accent: 0xf79b83, alt: 0xfffcf7, fit: 0.92 },
    };

    // 原版黏土材质参数，不得改动
    const makeClayMat = (color) => new THREE.MeshStandardMaterial({
      color, roughness: 0.95, metalness: 0.05, flatShading: false,
    });

    // 相机机位：透视相机的 fov 是竖直方向的，容器越窄横向可视范围越小。
    // 吃药动画会瞬间压扁到 0.55，横向被放大到 1.45 倍，此时狐狸尾巴/猫尾会顶出画面。
    // 所以容器竖长（aspect<1）时把相机往后拉，保证横向永远不窄于正方形时的取景。
    const CAM_Z = 7.5;
    const cameraZ = (aspect) => CAM_Z / Math.min(1, aspect || 1);

    // 底部加胖的球——原版兔子头的手法，是黏土「坐感」的来源
    function plumpSphere(r, fatten = 1.15, seg = 40) {
      const g = new THREE.SphereGeometry(r, seg, seg);
      const p = g.attributes.position;
      for (let i = 0; i < p.count; i++) {
        if (p.getY(i) < 0) { p.setX(i, p.getX(i) * fatten); p.setZ(i, p.getZ(i) * fatten); }
      }
      g.computeVertexNormals();
      return g;
    }

    // 椭球——四肢、躯干、肚皮的通用积木
    function blob(mat, sx, sy, sz, x = 0, y = 0, z = 0) {
      const m = new THREE.Mesh(new THREE.SphereGeometry(1, 28, 28), mat);
      m.scale.set(sx, sy, sz);
      m.position.set(x, y, z);
      return m;
    }

    // 记录初始姿态，供动画在其基础上叠加偏移
    function pivot(x, y, z, rz = 0, rx = 0) {
      const g = new THREE.Group();
      g.position.set(x, y, z);
      g.rotation.z = rz;
      g.rotation.x = rx;
      g.userData.base = { rx, rz };
      g.userData.cur = rx;   // 动画中的平滑基线，与叠加的正弦抖动分开存
      return g;
    }

    // 亮黑眼珠 + 蜜桃腮红，六种动物统一
    function addFace(head, mats, eyeR, ex, ey, ez, cheekR, cx, cy, cz) {
      const eyeGeo = new THREE.SphereGeometry(eyeR, 24, 24);
      const eyeL = new THREE.Mesh(eyeGeo, mats.eye); eyeL.position.set(-ex, ey, ez);
      const eyeR2 = new THREE.Mesh(eyeGeo, mats.eye); eyeR2.position.set(ex, ey, ez);
      head.add(eyeL, eyeR2);
      if (cheekR > 0) {
        const cGeo = new THREE.SphereGeometry(cheekR, 20, 14);
        const cL = new THREE.Mesh(cGeo, mats.cheek); cL.position.set(-cx, cy, cz);
        const cR = new THREE.Mesh(cGeo, mats.cheek); cR.position.set(cx, cy, cz);
        head.add(cL, cR);
      }
      return [eyeL, eyeR2];
    }

    // ---------------------------------------------------------------- 兔兔·糖包
    function buildBunny(mats) {
      const g = new THREE.Group();
      const head = new THREE.Group(); head.position.y = 0.62; g.add(head);
      head.add(new THREE.Mesh(plumpSphere(1.15), mats.body));

      const ears = [-1, 1].map((s) => {
        // 长耳是兔子的识别特征，但拉伸帧会顶出画面，所以比原版略收短
        const p = pivot(s * 0.46, 0.66, -0.08, s * -0.15, -0.1);
        const ear = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.34, 1.35, 24), mats.body);
        ear.position.y = 0.66;
        const inner = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.18, 1.1, 20), mats.accent);
        inner.position.set(0, 0.66, 0.14);
        p.add(ear, inner); head.add(p); return p;
      });

      const nose = new THREE.Mesh(new THREE.SphereGeometry(0.09, 16, 16), mats.accent);
      nose.position.set(0, -0.2, 1.1); head.add(nose);
      const eyes = addFace(head, mats, 0.115, 0.4, 0.02, 1.04, 0.2, 0.6, -0.3, 0.95);

      g.add(blob(mats.body, 1.0, 0.92, 0.85, 0, -0.85, 0));
      const arms = [-1, 1].map((s) => {
        const p = pivot(s * 0.9, -0.62, 0.18, s * 0.22);
        p.add(blob(mats.body, 0.24, 0.4, 0.24, 0, -0.34, 0));
        g.add(p); return p;
      });
      [-1, 1].forEach((s) => g.add(blob(mats.body, 0.4, 0.26, 0.54, s * 0.52, -1.6, 0.26)));
      g.add(blob(mats.body, 0.3, 0.3, 0.28, 0, -1.0, -0.86));   // 团子尾巴
      return { group: g, head, ears, arms, eyes, tail: null, wings: [] };
    }

    // ---------------------------------------------------------------- 小熊·奶酪熊
    function buildBear(mats) {
      const g = new THREE.Group();
      const head = new THREE.Group(); head.position.y = 0.58; g.add(head);
      head.add(new THREE.Mesh(plumpSphere(1.18, 1.1), mats.body));

      const ears = [-1, 1].map((s) => {
        const p = pivot(s * 0.82, 0.78, -0.12);
        const ear = new THREE.Mesh(new THREE.SphereGeometry(0.32, 22, 22), mats.body);
        const inner = new THREE.Mesh(new THREE.SphereGeometry(0.18, 18, 18), mats.accent);
        inner.position.z = 0.16; inner.scale.z = 0.6;
        p.add(ear, inner); head.add(p); return p;
      });

      head.add(blob(mats.alt, 0.48, 0.34, 0.34, 0, -0.44, 0.92));  // 吻部
      const nose = new THREE.Mesh(new THREE.SphereGeometry(0.15, 18, 18), mats.accent);
      nose.position.set(0, -0.34, 1.22); head.add(nose);
      const eyes = addFace(head, mats, 0.12, 0.4, 0.08, 1.06, 0.19, 0.68, -0.24, 0.9);

      g.add(blob(mats.body, 1.12, 0.98, 0.92, 0, -0.95, 0));
      g.add(blob(mats.alt, 0.62, 0.52, 0.3, 0, -0.92, 0.78));       // 肚皮
      const arms = [-1, 1].map((s) => {
        const p = pivot(s * 1.0, -0.72, 0.14, s * 0.26);
        p.add(blob(mats.body, 0.3, 0.46, 0.3, 0, -0.38, 0));
        g.add(p); return p;
      });
      [-1, 1].forEach((s) => g.add(blob(mats.body, 0.44, 0.34, 0.54, s * 0.58, -1.68, 0.22)));
      g.add(blob(mats.body, 0.22, 0.22, 0.2, 0, -1.24, -0.92));
      return { group: g, head, ears, arms, eyes, tail: null, wings: [] };
    }

    // ---------------------------------------------------------------- 小猫·小甜橘
    function buildCat(mats) {
      const g = new THREE.Group();
      const head = new THREE.Group(); head.position.y = 0.66; g.add(head);
      const skull = new THREE.Mesh(plumpSphere(1.08, 1.12), mats.body);
      skull.scale.x = 1.06; head.add(skull);

      const ears = [-1, 1].map((s) => {                              // 三角立耳
        const p = pivot(s * 0.6, 0.78, -0.04, s * -0.2);
        const ear = new THREE.Mesh(new THREE.ConeGeometry(0.33, 0.6, 4), mats.body);
        ear.position.y = 0.26; ear.rotation.y = Math.PI / 4;
        const inner = new THREE.Mesh(new THREE.ConeGeometry(0.19, 0.38, 4), mats.accent);
        inner.position.set(0, 0.22, 0.1); inner.rotation.y = Math.PI / 4;
        p.add(ear, inner); head.add(p); return p;
      });

      [-1, 1].forEach((s) => head.add(blob(mats.alt, 0.26, 0.2, 0.18, s * 0.19, -0.42, 0.92)));
      const nose = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.12, 3), mats.accent);
      nose.position.set(0, -0.26, 1.06); nose.rotation.x = Math.PI; head.add(nose);
      [-1, 1].forEach((s) => [0.06, -0.06].forEach((dy) => {         // 胡须
        const w = new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.016, 0.8, 6), mats.eye);
        w.position.set(s * 0.62, -0.36 + dy, 0.78); w.rotation.z = Math.PI / 2 + s * 0.12;
        head.add(w);
      }));
      const eyes = addFace(head, mats, 0.13, 0.42, 0.04, 0.98, 0.19, 0.66, -0.28, 0.86);

      g.add(blob(mats.body, 0.86, 0.94, 0.8, 0, -0.9, 0));
      const arms = [-1, 1].map((s) => {
        const p = pivot(s * 0.42, -1.32, 0.42);
        p.add(blob(mats.body, 0.22, 0.28, 0.32, 0, -0.22, 0));
        g.add(p); return p;
      });
      [-1, 1].forEach((s) => g.add(blob(mats.body, 0.34, 0.4, 0.42, s * 0.68, -1.3, -0.04)));

      // 长尾逐节收细，并向侧后方扬起——正面也要看得见，否则少了一个识别特征
      const tail = pivot(0.46, -1.02, -0.52, -0.46, -0.18);
      [0, 1, 2, 3, 4].forEach((i) => {
        const r = 0.2 - i * 0.022;
        const seg = new THREE.Mesh(new THREE.SphereGeometry(r, 18, 18), i === 4 ? mats.alt : mats.body);
        seg.position.set(0, i * 0.34, -i * 0.1);
        tail.add(seg);
      });
      g.add(tail);
      return { group: g, head, ears, arms, eyes, tail, wings: [] };
    }

    // ---------------------------------------------------------------- 小狗·糯米
    function buildDog(mats) {
      const g = new THREE.Group();
      const head = new THREE.Group(); head.position.y = 0.62; g.add(head);
      head.add(new THREE.Mesh(plumpSphere(1.14), mats.body));

      const ears = [-1, 1].map((s) => {                              // 垂耳
        const p = pivot(s * 0.88, 0.34, 0.02, s * 0.3);
        const ear = blob(mats.alt, 0.28, 0.56, 0.16, 0, -0.5, 0);
        p.add(ear); head.add(p); return p;
      });

      head.add(blob(mats.body, 0.4, 0.32, 0.44, 0, -0.36, 0.94));    // 吻部
      const nose = new THREE.Mesh(new THREE.SphereGeometry(0.14, 18, 18), mats.accent);
      nose.position.set(0, -0.3, 1.36); head.add(nose);
      const mouth = new THREE.Mesh(new THREE.TorusGeometry(0.12, 0.028, 8, 20, Math.PI), mats.eye);
      mouth.position.set(0, -0.5, 1.2); mouth.rotation.z = Math.PI; head.add(mouth);
      const eyes = addFace(head, mats, 0.12, 0.4, 0.1, 1.04, 0.2, 0.66, -0.24, 0.9);

      g.add(blob(mats.body, 0.94, 0.9, 0.85, 0, -0.9, 0));
      g.add(blob(mats.alt, 0.5, 0.44, 0.26, 0, -0.82, 0.74));
      const arms = [-1, 1].map((s) => {
        const p = pivot(s * 0.48, -1.3, 0.4);
        p.add(blob(mats.body, 0.24, 0.3, 0.32, 0, -0.24, 0));
        g.add(p); return p;
      });
      [-1, 1].forEach((s) => g.add(blob(mats.body, 0.3, 0.34, 0.36, s * 0.62, -1.42, -0.18)));

      const tail = pivot(0.2, -0.8, -0.68, -0.4, 0.45);              // 摇尾巴，稍偏侧向便于正面看见
      tail.add(blob(mats.body, 0.15, 0.42, 0.15, 0, 0.38, 0));
      g.add(tail);
      return { group: g, head, ears, arms, eyes, tail, wings: [] };
    }

    // ---------------------------------------------------------------- 企鹅·冰豆
    function buildPenguin(mats) {
      const g = new THREE.Group();
      const head = new THREE.Group(); head.position.y = 0.6; g.add(head);
      head.add(new THREE.Mesh(plumpSphere(1.0, 1.18), mats.body));
      head.add(blob(mats.alt, 0.6, 0.66, 0.34, 0, -0.08, 0.72));     // 白脸

      const beak = new THREE.Mesh(new THREE.ConeGeometry(0.19, 0.4, 16), mats.accent);
      beak.position.set(0, -0.22, 0.98); beak.rotation.x = Math.PI / 2; head.add(beak);
      const eyes = addFace(head, mats, 0.115, 0.3, 0.14, 0.98, 0.16, 0.56, -0.2, 0.78);

      g.add(blob(mats.body, 0.98, 1.12, 0.88, 0, -0.9, 0));
      g.add(blob(mats.alt, 0.68, 0.9, 0.42, 0, -0.9, 0.6));          // 白肚皮
      const wings = [-1, 1].map((s) => {                             // 翅膀
        const p = pivot(s * 0.9, -0.62, 0, s * 0.18);
        p.add(blob(mats.body, 0.16, 0.58, 0.38, 0, -0.5, 0));
        g.add(p); return p;
      });
      [-1, 1].forEach((s) => g.add(blob(mats.accent, 0.32, 0.12, 0.42, s * 0.4, -1.92, 0.32)));
      return { group: g, head, ears: [], arms: [], eyes, tail: null, wings };
    }

    // ---------------------------------------------------------------- 狐狸·莓莓
    function buildFox(mats) {
      const g = new THREE.Group();
      const head = new THREE.Group(); head.position.y = 0.66; g.add(head);
      head.add(new THREE.Mesh(plumpSphere(1.06, 1.1), mats.body));

      const ears = [-1, 1].map((s) => {                              // 大尖耳
        const p = pivot(s * 0.62, 0.76, -0.06, s * -0.22);
        const ear = new THREE.Mesh(new THREE.ConeGeometry(0.32, 0.78, 4), mats.body);
        ear.position.y = 0.36; ear.rotation.y = Math.PI / 4;
        const inner = new THREE.Mesh(new THREE.ConeGeometry(0.18, 0.5, 4), mats.accent);
        inner.position.set(0, 0.32, 0.1); inner.rotation.y = Math.PI / 4;
        p.add(ear, inner); head.add(p); return p;
      });

      const snout = new THREE.Mesh(new THREE.ConeGeometry(0.32, 0.66, 20), mats.alt);
      snout.position.set(0, -0.36, 0.96); snout.rotation.x = Math.PI / 2; head.add(snout);
      const nose = new THREE.Mesh(new THREE.SphereGeometry(0.11, 16, 16), mats.accent);
      nose.position.set(0, -0.36, 1.3); head.add(nose);
      const eyes = addFace(head, mats, 0.12, 0.42, 0.08, 0.95, 0.18, 0.66, -0.22, 0.82);

      g.add(blob(mats.body, 0.88, 0.9, 0.8, 0, -0.9, 0));
      g.add(blob(mats.alt, 0.52, 0.46, 0.28, 0, -0.66, 0.7));        // 白胸毛
      const arms = [-1, 1].map((s) => {
        const p = pivot(s * 0.44, -1.3, 0.4);
        p.add(blob(mats.body, 0.21, 0.3, 0.3, 0, -0.24, 0));
        g.add(p); return p;
      });
      [-1, 1].forEach((s) => g.add(blob(mats.body, 0.3, 0.34, 0.38, s * 0.66, -1.34, -0.1)));

      // 蓬松大尾巴（狐狸的识别特征），侧后方扬起，白尾尖
      const tail = pivot(0.44, -1.08, -0.46, -0.68, -0.22);
      [0.34, 0.32, 0.28, 0.22].forEach((r, i) => {
        const seg = new THREE.Mesh(new THREE.SphereGeometry(r, 20, 20), i === 3 ? mats.alt : mats.body);
        seg.position.set(0, 0.16 + i * 0.32, 0);
        tail.add(seg);
      });
      g.add(tail);
      return { group: g, head, ears, arms, eyes, tail, wings: [] };
    }

    const PET_BUILDERS = {
      bunny: buildBunny, bear: buildBear, cat: buildCat,
      dog: buildDog, penguin: buildPenguin, fox: buildFox,
    };

const NAMES = {
  "bunny": "兔兔 · 糖包",
  "bear": "小熊 · 奶酪熊",
  "cat": "小猫 · 小甜橘",
  "dog": "小狗 · 糯米",
  "penguin": "企鹅 · 冰豆",
  "fox": "狐狸 · 莓莓"
};
const STATES = [
  ['idle','平静'], ['happy','开心'], ['eating','吃药'],
  ['sad','没精神'], ['sleeping','睡着了'],
];
const lerp = (a,b,t) => a + (b-a)*t;
let currentState = 'idle';

const bar = document.getElementById('bar');
STATES.forEach(([k,label]) => {
  const b = document.createElement('button');
  b.textContent = label;
  b.className = k === 'idle' ? 'on' : '';
  b.onclick = () => {
    currentState = k;
    [...bar.children].forEach(c => c.className = '');
    b.className = 'on';
    if (k === 'eating') stages.forEach(s => { s.target = 0.55; setTimeout(()=>{ s.target = 1.15; setTimeout(()=>{ s.target = 1.0; },180); },150); });
  };
  bar.appendChild(b);
});

// 预览卡是正方形；verify-pets.js 会覆写 ASPECT 来核查竖长容器的取景
var ASPECT = globalThis.__forceAspect || 1;
const SIZE = 280;
const stages = [];
const grid = document.getElementById('grid');

Object.keys(PET_BUILDERS).forEach(id => {
  const spec = PET_SPECS[id];
  const card = document.createElement('div');
  card.className = 'card';
  const holder = document.createElement('div');
  card.appendChild(holder);
  const cap = document.createElement('div');
  cap.className = 'cap';
  cap.textContent = NAMES[id];
  card.appendChild(cap);
  grid.appendChild(card);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(40, ASPECT, 0.1, 100);
  camera.position.set(0, 0, cameraZ(ASPECT));

  // 灯光与主应用完全一致
  scene.add(new THREE.AmbientLight(0xfff5f0, 0.7));
  const d1 = new THREE.DirectionalLight(0xffffff, 0.8); d1.position.set(5, 8, 5); scene.add(d1);
  const d2 = new THREE.DirectionalLight(0xffdcd3, 0.4); d2.position.set(-5, -5, -2); scene.add(d2);

  const mats = {
    body: makeClayMat(spec.body),
    alt: makeClayMat(spec.alt),
    accent: new THREE.MeshStandardMaterial({ color: spec.accent, roughness: 0.9, metalness: 0.0 }),
    eye: new THREE.MeshStandardMaterial({ color: 0x111116, roughness: 0.1, metalness: 0.9 }),
    cheek: new THREE.MeshStandardMaterial({ color: 0xfca18b, roughness: 0.95, transparent: true, opacity: 0.8 }),
  };
  const model = PET_BUILDERS[id](mats);
  model.headTilt = 0;
  model.group.scale.setScalar(spec.fit || 0.92);

  const stage = new THREE.Group();
  stage.position.y = -0.2;
  stage.add(model.group);
  scene.add(stage);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(SIZE, Math.round(SIZE / ASPECT));
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  holder.appendChild(renderer.domElement);

  const st = { scene, camera, renderer, stage, model, cur: 1, vel: 0, target: 1, angY: 0, angX: 0 };
  stages.push(st);

  // 拖动旋转 + 点击挤压，与主应用同一套手感
  let drag = null;
  const el = renderer.domElement;
  el.addEventListener('pointerdown', e => { el.setPointerCapture(e.pointerId); drag = { x:e.clientX, y:e.clientY, aY:st.angY, aX:st.angX, moved:false }; });
  el.addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = e.clientX-drag.x, dy = e.clientY-drag.y;
    if (Math.abs(dx)+Math.abs(dy) > 6) drag.moved = true;
    st.angY = drag.aY + dx*0.012;
    st.angX = Math.max(-0.55, Math.min(0.55, drag.aX + dy*0.008));
  });
  el.addEventListener('pointerup', () => {
    if (drag && !drag.moved) { st.target = 0.65; setTimeout(()=>{ st.target = 1.0; },120); }
    drag = null;
  });
});

const clock = new THREE.Clock();
(function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  const st0 = currentState;

  let amplitude=0.08, speed=2.0, headTilt=0, eyeOpen=1, limbAmp=0.12, limbSpeed=2.4;
  if (st0==='sad')          { amplitude=0.03; speed=0.8; headTilt=-0.16; eyeOpen=0.62; limbAmp=0.04; limbSpeed=1.0; }
  else if (st0==='sleeping'){ amplitude=0.02; speed=0.5; headTilt=-0.10; eyeOpen=0.06; limbAmp=0.02; limbSpeed=0.6; }
  else if (st0==='happy')   { amplitude=0.16; speed=4.2; headTilt=0.06;  eyeOpen=0.30; limbAmp=0.30; limbSpeed=5.0; }
  else if (st0==='eating')  { amplitude=0.10; speed=3.2;                 eyeOpen=0.45; limbAmp=0.22; limbSpeed=4.0; }

  for (const s of stages) {
    const force = s.target - s.cur;
    s.vel += force*0.22; s.vel *= 0.76; s.cur += s.vel;
    s.stage.scale.y = s.cur;
    s.stage.scale.x = 2.0 - s.cur;
    s.stage.scale.z = 2.0 - s.cur;
    s.stage.position.y = -0.2 + Math.sin(t*speed)*amplitude;
    s.stage.rotation.y = s.angY + Math.sin(t*0.7)*0.04;
    s.stage.rotation.x = s.angX;
    s.stage.rotation.z = Math.cos(t*0.5)*0.03;

    const m = s.model;
    m.headTilt = lerp(m.headTilt, headTilt, 0.08);
    m.head.rotation.x = m.headTilt + (st0==='eating' ? Math.sin(t*16)*0.05 : 0);
    m.eyes.forEach(e => { e.scale.y = lerp(e.scale.y, eyeOpen, 0.12); });
    m.ears.forEach((p,i) => {
      const droop = (st0==='sad'||st0==='sleeping') ? 0.55 : 0;
      p.userData.cur = lerp(p.userData.cur, p.userData.base.rx + droop, 0.08);
      p.rotation.x = p.userData.cur + Math.sin(t*limbSpeed + i*1.7)*limbAmp*0.5;
    });
    m.arms.forEach((p,i) => { p.rotation.x = Math.sin(t*limbSpeed + i*Math.PI)*limbAmp*0.6; });
    m.wings.forEach((p,i) => { p.rotation.z = p.userData.base.rz + Math.sin(t*limbSpeed + i*Math.PI)*limbAmp*0.9; });
    if (m.tail) m.tail.rotation.z = m.tail.userData.base.rz + Math.sin(t*(limbSpeed+1.6))*limbAmp*1.3;

    s.renderer.render(s.scene, s.camera);
  }
})();
</script>
